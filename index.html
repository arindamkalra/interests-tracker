<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interests</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7f7f5; color: #1a1a1a; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

/* HEADER */
header { padding: 14px 24px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
header h1 { font-size: 17px; font-weight: 700; }
#syncStatus { font-size: 11px; color: #aaa; margin-left: auto; }

/* LAYOUT */
.app { display: flex; flex: 1; overflow: hidden; }

/* LEFT */
.left { width: 240px; min-width: 240px; background: #fff; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; flex-shrink: 0; }
.left-header { padding: 12px 14px; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
.left-header span { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; }
.add-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 6px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.add-btn:hover { background: #333; }
.interest-list { flex: 1; overflow-y: auto; padding: 6px; }
.interest-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 9px; margin-bottom: 1px; border: 1px solid transparent; }
.interest-item:hover { background: #f7f7f5; }
.interest-item.active { background: #f0efeb; border-color: #d9d9d4; }
.interest-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.active { background: #22c55e; }
.dot.next { background: #f59e0b; }
.dot.someday { background: #94a3b8; }
.dot.archived { background: #ddd; }
.interest-item .iname { flex: 1; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.interest-item .idel { opacity: 0; background: none; border: none; color: #bbb; cursor: pointer; font-size: 16px; padding: 0; line-height: 1; }
.interest-item:hover .idel { opacity: 1; }
.interest-item .idel:hover { color: #e53e3e; }

/* RIGHT */
.right { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ccc; gap: 8px; }
.empty-state .eicon { font-size: 32px; }
.empty-state p { font-size: 14px; }

/* DETAIL */
.detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.detail-top { padding: 18px 28px 0; flex-shrink: 0; }
.back-btn { display: none; align-items: center; gap: 5px; background: none; border: none; color: #888; font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 10px; }
.back-btn:hover { color: #1a1a1a; }
.title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ititle { font-size: 22px; font-weight: 700; border: none; background: none; outline: none; flex: 1; color: #1a1a1a; }
.ititle:focus { border-bottom: 2px solid #1a1a1a; }
.status-sel { font-size: 11px; font-weight: 600; border: 1px solid #e5e5e5; border-radius: 20px; padding: 4px 10px; background: #fff; cursor: pointer; outline: none; color: #555; flex-shrink: 0; }

/* TABS */
.tabs { display: flex; border-bottom: 1px solid #e5e5e5; }
.tab-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 16px; font-size: 13px; font-weight: 600; color: #aaa; cursor: pointer; margin-bottom: -1px; }
.tab-btn.on { color: #1a1a1a; border-bottom-color: #1a1a1a; }
.tab-btn:hover:not(.on) { color: #555; }
.tab-pane { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 20px 28px; gap: 20px; }
.tab-pane.on { display: flex; }

/* SECTION LABEL */
.slabel { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #bbb; margin-bottom: 8px; }

/* NOTE TEXTAREA */
.note-input { width: 100%; border: 1px solid #e5e5e5; border-radius: 10px; padding: 14px; font-size: 14px; line-height: 1.6; resize: none; outline: none; background: #fff; color: #1a1a1a; font-family: inherit; min-height: 120px; }
.note-input:focus { border-color: #aaa; }

/* NOTE CARDS */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.note-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px; position: relative; }
.note-card:hover { border-color: #ccc; }
.note-card textarea { width: 100%; border: none; outline: none; resize: none; font-size: 13px; line-height: 1.55; color: #1a1a1a; font-family: inherit; background: transparent; min-height: 60px; }
.card-del { position: absolute; top: 6px; right: 6px; background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; opacity: 0; line-height: 1; }
.note-card:hover .card-del { opacity: 1; }
.card-del:hover { color: #e53e3e; }

/* LINKS */
.links-list { display: flex; flex-direction: column; gap: 8px; }
.link-row { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; }
.link-row:hover { border-color: #ccc; }
.link-inner { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.link-title { border: none; outline: none; font-size: 13px; font-weight: 500; color: #1a1a1a; background: none; width: 100%; }
.link-url-input { border: none; outline: none; font-size: 11px; color: #888; background: none; width: 100%; }
.link-url-display { font-size: 11px; color: #2563eb; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.link-url-display:hover { text-decoration: underline; }
.link-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 15px; padding: 0; opacity: 0; flex-shrink: 0; }
.link-row:hover .link-del { opacity: 1; }
.link-del:hover { color: #e53e3e; }
.add-link { background: none; border: 1px dashed #ddd; border-radius: 8px; color: #bbb; font-size: 13px; cursor: pointer; padding: 8px 12px; text-align: left; }
.add-link:hover { border-color: #aaa; color: #666; }

/* PROJECTS LIST */
.proj-list { display: flex; flex-direction: column; gap: 8px; }
.proj-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
.proj-row:hover { border-color: #ccc; background: #fafaf9; }
.proj-icon { font-size: 16px; flex-shrink: 0; }
.proj-name { flex: 1; font-size: 14px; font-weight: 600; }
.proj-meta { font-size: 11px; color: #bbb; }
.proj-arrow { color: #ccc; }
.proj-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 15px; opacity: 0; padding: 0; }
.proj-row:hover .proj-del { opacity: 1; }
.proj-del:hover { color: #e53e3e; }
.add-proj { background: none; border: 1px dashed #ddd; border-radius: 10px; color: #bbb; font-size: 13px; cursor: pointer; padding: 12px 16px; text-align: left; }
.add-proj:hover { border-color: #aaa; color: #666; }

/* SAVE BAR */
.save-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 10px 28px; border-top: 1px solid #f0f0f0; flex-shrink: 0; background: #fff; }
.save-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 7px 18px; font-size: 13px; cursor: pointer; }
.save-btn:hover { background: #333; }
.saved-msg { font-size: 12px; color: #22c55e; opacity: 0; transition: opacity 0.3s; }
.saved-msg.on { opacity: 1; }

/* PROJECT PAGE */
.proj-page { position: absolute; inset: 0; background: #fff; display: none; flex-direction: column; z-index: 10; }
.proj-page.on { display: flex; }
.proj-page-header { padding: 14px 28px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.proj-page-back { background: none; border: none; color: #888; font-size: 13px; cursor: pointer; }
.proj-page-back:hover { color: #1a1a1a; }
#projSyncStatus { font-size: 11px; color: #aaa; }
.proj-page-save { margin-left: auto; background: #1a1a1a; color: #fff; border: none; border-radius: 7px; padding: 6px 16px; font-size: 13px; cursor: pointer; }
.proj-page-save:hover { background: #333; }
.proj-page-body { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.proj-title { font-size: 30px; font-weight: 700; border: none; outline: none; background: none; width: 100%; margin-bottom: 12px; color: #1a1a1a; }
.proj-title::placeholder { color: #ddd; }

/* BLOCKS */
.block-wrap { display: flex; align-items: flex-start; gap: 6px; padding: 2px 0; }
.block-handle { color: #ddd; font-size: 12px; cursor: grab; padding-top: 4px; opacity: 0; width: 14px; flex-shrink: 0; }
.block-wrap:hover .block-handle { opacity: 1; }
.block-body { flex: 1; min-width: 0; }
.block-del { background: none; border: none; color: #ddd; cursor: pointer; font-size: 14px; padding: 0; opacity: 0; flex-shrink: 0; padding-top: 3px; }
.block-wrap:hover .block-del { opacity: 1; }
.block-del:hover { color: #e53e3e; }

.b-text { width: 100%; border: none; outline: none; resize: none; font-size: 15px; line-height: 1.65; color: #1a1a1a; font-family: inherit; background: none; }
.b-text::placeholder { color: #ccc; }
.b-heading { width: 100%; border: none; outline: none; font-size: 20px; font-weight: 700; color: #1a1a1a; font-family: inherit; background: none; }
.b-heading::placeholder { color: #ddd; }

.b-checklist { display: flex; flex-direction: column; gap: 5px; }
.b-check-row { display: flex; align-items: center; gap: 8px; }
.b-check-row input[type=checkbox] { accent-color: #1a1a1a; width: 15px; height: 15px; flex-shrink: 0; }
.b-check-row input[type=text] { flex: 1; border: none; outline: none; font-size: 15px; background: none; color: #1a1a1a; font-family: inherit; }
.b-check-row input[type=text].checked { text-decoration: line-through; color: #aaa; }
.b-check-row .rm { background: none; border: none; color: #ddd; cursor: pointer; font-size: 14px; padding: 0; opacity: 0; }
.b-check-row:hover .rm { opacity: 1; }
.add-check { background: none; border: none; color: #bbb; font-size: 13px; cursor: pointer; padding: 2px 0; text-align: left; margin-top: 2px; }
.add-check:hover { color: #555; }

.b-link-box { display: flex; align-items: center; gap: 8px; background: #f7f7f5; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; }
.b-link-box .link-inner { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.b-link-title { border: none; outline: none; font-size: 13px; font-weight: 500; color: #1a1a1a; background: none; width: 100%; }
.b-link-url { border: none; outline: none; font-size: 11px; color: #888; background: none; width: 100%; }
.b-link-display { font-size: 11px; color: #2563eb; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-link-display:hover { text-decoration: underline; }
.b-link-box .rm { background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; padding: 0; opacity: 0; }
.b-link-box:hover .rm { opacity: 1; }

.add-block-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 0; }
.add-block { background: none; border: 1px solid #e5e5e5; border-radius: 6px; color: #999; font-size: 12px; cursor: pointer; padding: 5px 10px; }
.add-block:hover { border-color: #aaa; color: #333; background: #f7f7f5; }

/* MOBILE */
@media (max-width: 640px) {
  .app { flex-direction: column; }
  .left { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid #e5e5e5; max-height: 40vh; flex-shrink: 0; }
  .left.hidden { display: none; }
  .right { flex: 1; min-height: 0; }
  .detail { overflow: hidden; }
  .tab-pane { padding: 14px 16px; }
  .detail-top { padding: 14px 16px 0; }
  .tabs { padding: 0; }
  .save-bar { padding: 10px 16px; }
  .back-btn { display: flex; }
  .cards-grid { grid-template-columns: 1fr; }
  .note-input { font-size: 16px; }
  .proj-page-body { padding: 20px 16px; }
  .idel, .link-del, .card-del, .proj-del, .block-del, .b-link-box .rm, .b-check-row .rm { opacity: 1 !important; }
}
</style>
</head>
<body>

<header>
  <h1>🗂 Interests</h1>
  <span id="syncStatus"></span>
</header>

<div class="app">
  <div class="left" id="leftPanel">
    <div class="left-header">
      <span>All Interests</span>
      <button class="add-btn" onclick="addInterest()">+ Add</button>
    </div>
    <div class="interest-list" id="interestList"></div>
  </div>

  <div class="right" id="rightPanel">
    <div class="empty-state" id="emptyState">
      <div class="eicon">✦</div>
      <p>Select an interest or add a new one</p>
    </div>

    <div class="detail" id="detailPanel" style="display:none;">
      <div class="detail-top">
        <button class="back-btn" onclick="goBack()">← All Interests</button>
        <div class="title-row">
          <input class="ititle" id="iTitle" type="text" placeholder="Interest name" oninput="markDirty()">
          <select class="status-sel" id="iStatus" onchange="markDirty(); renderList()">
            <option value="next">🟡 Up Next</option>
            <option value="active">🟢 Active</option>
            <option value="someday">⚪ Someday</option>
            <option value="archived">🔘 Archived</option>
          </select>
        </div>
        <div class="tabs">
          <button class="tab-btn on" data-tab="notes" onclick="switchTab('notes')">Notes</button>
          <button class="tab-btn" data-tab="projects" onclick="switchTab('projects')">Projects</button>
        </div>
      </div>

      <div class="tab-pane on" id="pane-notes">
        <div>
          <textarea class="note-input" id="noteInput" placeholder="Jot down anything useful — what you learned, where you left off, ideas… Paste a link and it'll also go to Resources."></textarea>
        </div>
        <div>
          <div class="slabel">Saved Notes</div>
          <div class="cards-grid" id="cardsGrid"></div>
        </div>
        <div>
          <div class="slabel">Resources & Links</div>
          <div class="links-list" id="linksList"></div>
          <button class="add-link" onclick="addLink()">+ Add link</button>
        </div>
      </div>

      <div class="tab-pane" id="pane-projects">
        <div class="proj-list" id="projList"></div>
        <button class="add-proj" onclick="addProject()">+ New project</button>
      </div>

      <div class="save-bar">
        <span class="saved-msg" id="savedMsg">Saved ✓</span>
        <button class="save-btn" onclick="saveInterest()">Save</button>
      </div>
    </div>

    <!-- PROJECT PAGE -->
    <div class="proj-page" id="projPage">
      <div class="proj-page-header">
        <button class="proj-page-back" onclick="closeProjPage()">← Back</button>
        <span id="projSyncStatus"></span>
        <button class="proj-page-save" onclick="saveProjPage()">Save</button>
      </div>
      <div class="proj-page-body" id="projPageBody"></div>
    </div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const SB_URL = 'https://dvwdiqfkbooazvdjuzxg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2d2RpcWZrYm9vYXp2ZGp1enhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTQ3NjAsImV4cCI6MjA5NTc3MDc2MH0.sExMY6IZzJGcdtP-JKQJMkiSgqkuizMwE5nKNog6QOo';
const REC_ID = 'main';
const USER_ID = 'arindam';

// ─── STATE (single source of truth) ──────────────────────────────────────────
let interests = [];   // all data lives here
let selId = null;     // selected interest id
let projId = null;    // open project id
let dirty = false;

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const getSel = () => interests.find(i => i.id === selId);
const getProj = () => getSel()?.projects?.find(p => p.id === projId);
const isMobile = () => window.innerWidth <= 640;
const today = () => new Date().toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
const mkInterest = () => ({ id: uid(), name: 'New Interest', status: 'next', noteCards: [], links: [], projects: [] });
const mkProject = () => ({ id: uid(), name: 'New Project', blocks: [] });
const mkBlock = type => {
  const b = { id: uid(), type };
  if (type === 'text' || type === 'heading') b.text = '';
  if (type === 'checklist') b.items = [];
  if (type === 'link') { b.url = ''; b.title = ''; }
  return b;
};
const URL_RE = () => /https?:\/\/[^\s"'<>]+/g;

function markDirty() { dirty = true; }

// ─── SUPABASE ─────────────────────────────────────────────────────────────────
const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' };

async function dbLoad() {
  const res = await fetch(`${SB_URL}/rest/v1/interests?id=eq.${REC_ID}&user_id=eq.${USER_ID}`, { headers: SB_HEADERS });
  const rows = await res.json();
  return rows[0]?.data || null;
}

async function dbSave() {
  const sync = document.getElementById('syncStatus');
  sync.textContent = 'Saving…';
  const res = await fetch(`${SB_URL}/rest/v1/interests`, {
    method: 'POST', headers: SB_HEADERS,
    body: JSON.stringify({ id: REC_ID, user_id: USER_ID, data: interests, updated_at: new Date().toISOString() })
  });
  if (res.ok) {
    sync.textContent = 'Synced ✓';
    setTimeout(() => sync.textContent = '', 2000);
  } else {
    sync.textContent = '⚠️ Save failed';
    console.error('Save failed:', res.status, await res.text());
  }
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
async function boot() {
  setStatus('⏳ Loading…');
  const saved = await dbLoad();
  if (saved && saved.length > 0) {
    // migrate old shape to new
    interests = saved.map(item => ({
      id: item.id,
      name: item.name || 'Untitled',
      status: item.status || 'next',
      noteCards: item.noteCards || (item.notes ? [{ id: uid(), text: item.notes }] : []),
      links: (item.links || []).map(l => typeof l === 'string' ? { id: uid(), url: l, title: '' } : l),
      projects: (item.projects || []).map(p => ({ id: p.id, name: p.name || 'Untitled', blocks: p.blocks || [] }))
    }));
  } else {
    interests = ['Cooking','Baking','Embroidery','Pottery','Hiking'].map(name => ({ ...mkInterest(), name }));
    await dbSave();
  }
  setStatus('');
  renderList();
  // restore last selected
  const lastId = localStorage.getItem('lastSelId');
  if (lastId && interests.find(i => i.id === lastId)) openInterest(lastId);
}

function setStatus(msg) { document.getElementById('emptyState').innerHTML = msg ? `<div class="eicon">⏳</div><p>${msg}</p>` : '<div class="eicon">✦</div><p>Select an interest or add a new one</p>'; }

// ─── INTEREST LIST ────────────────────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('interestList');
  el.innerHTML = '';
  const order = { active:0, next:1, someday:2, archived:3 };
  [...interests].sort((a,b) => order[a.status]-order[b.status]).forEach(item => {
    const div = document.createElement('div');
    div.className = 'interest-item' + (item.id === selId ? ' active' : '');
    div.innerHTML = `<span class="dot ${item.status}"></span><span class="iname">${esc(item.name)}</span><button class="idel" onclick="deleteInterest('${item.id}',event)">×</button>`;
    div.addEventListener('click', () => openInterest(item.id));
    el.appendChild(div);
  });
}

function addInterest() {
  const item = mkInterest();
  interests.unshift(item);
  dbSave();
  openInterest(item.id);
  setTimeout(() => { document.getElementById('iTitle').select(); }, 50);
}

function deleteInterest(id, e) {
  e.stopPropagation();
  if (!confirm('Delete this interest?')) return;
  interests = interests.filter(i => i.id !== id);
  if (selId === id) { selId = null; showEmpty(); }
  dbSave(); renderList();
}

function showEmpty() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('detailPanel').style.display = 'none';
  if (isMobile()) document.getElementById('leftPanel').classList.remove('hidden');
}

function goBack() {
  if (dirty) saveInterest(true);
  selId = null; showEmpty(); renderList();
}

// ─── OPEN INTEREST ────────────────────────────────────────────────────────────
// This is the ONLY place we read from state into the DOM for the interest detail
function openInterest(id) {
  if (dirty && selId && selId !== id) saveInterest(true);
  selId = id; dirty = false;
  localStorage.setItem('lastSelId', id);
  renderList();

  const item = getSel(); if (!item) return;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('detailPanel').style.display = 'flex';
  document.getElementById('detailPanel').style.flexDirection = 'column';
  if (isMobile()) document.getElementById('leftPanel').classList.add('hidden');

  document.getElementById('iTitle').value = item.name;
  document.getElementById('iStatus').value = item.status;
  document.getElementById('noteInput').value = '';

  switchTab('notes'); // this renders cards, links, projects
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + tab));
  // always re-render from state when switching tabs
  const item = getSel(); if (!item) return;
  if (tab === 'notes') { renderCards(); renderLinks(); }
  if (tab === 'projects') renderProjects();
}

// ─── NOTES: CARDS ─────────────────────────────────────────────────────────────
// Renders directly from state — never reads from DOM
function renderCards() {
  const item = getSel(); if (!item) return;
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  item.noteCards.forEach((card, i) => {
    const div = document.createElement('div'); div.className = 'note-card';
    const del = document.createElement('button'); del.className = 'card-del'; del.textContent = '×';
    del.onclick = () => { item.noteCards.splice(i, 1); dbSave(); renderCards(); };
    const ta = document.createElement('textarea');
    ta.value = card.text;
    // write directly to state on input — no DOM reading needed at save time
    ta.oninput = () => { card.text = ta.value; markDirty(); };
    div.appendChild(del); div.appendChild(ta);
    grid.appendChild(div);
  });
}

function saveNote() {
  const item = getSel(); if (!item) return;
  const ta = document.getElementById('noteInput');
  const text = ta.value.trim(); if (!text) return;
  // extract links
  const urls = text.match(URL_RE()) || [];
  urls.forEach(url => {
    const clean = url.replace(/[),.\]]+$/, '');
    if (!item.links.find(l => l.url === clean)) item.links.push({ id: uid(), url: clean, title: '' });
  });
  // add card with full text (including link)
  item.noteCards.unshift({ id: uid(), text });
  ta.value = '';
  dbSave();
  renderCards();
  renderLinks();
}

// ─── NOTES: LINKS ─────────────────────────────────────────────────────────────
function renderLinks() {
  const item = getSel(); if (!item) return;
  const list = document.getElementById('linksList');
  list.innerHTML = '';
  item.links.forEach((lk, i) => {
    const row = document.createElement('div'); row.className = 'link-row';
    const inner = document.createElement('div'); inner.className = 'link-inner';
    const titleEl = document.createElement('input'); titleEl.className = 'link-title';
    titleEl.value = lk.title; titleEl.placeholder = 'Title (optional)';
    titleEl.oninput = () => { lk.title = titleEl.value; markDirty(); };
    inner.appendChild(titleEl);
    if (lk.url && lk.url.startsWith('http')) {
      const a = document.createElement('a'); a.className = 'link-url-display';
      a.href = lk.url; a.target = '_blank'; a.textContent = lk.url;
      inner.appendChild(a);
    } else {
      const urlEl = document.createElement('input'); urlEl.className = 'link-url-input';
      urlEl.value = lk.url; urlEl.placeholder = 'https://…';
      urlEl.oninput = () => { lk.url = urlEl.value; markDirty(); if (lk.url.startsWith('http') && lk.url.length > 10) renderLinks(); };
      inner.appendChild(urlEl);
    }
    const del = document.createElement('button'); del.className = 'link-del'; del.textContent = '×';
    del.onclick = () => { item.links.splice(i, 1); dbSave(); renderLinks(); };
    row.appendChild(inner); row.appendChild(del);
    list.appendChild(row);
  });
}

function addLink() {
  const item = getSel(); if (!item) return;
  item.links.push({ id: uid(), url: '', title: '' });
  dbSave(); renderLinks();
  setTimeout(() => { const inputs = document.getElementById('linksList').querySelectorAll('.link-url-input'); if (inputs.length) inputs[inputs.length-1].focus(); }, 30);
}

// ─── PROJECTS LIST ────────────────────────────────────────────────────────────
function renderProjects() {
  const item = getSel(); if (!item) return;
  const list = document.getElementById('projList');
  list.innerHTML = '';
  item.projects.forEach(proj => {
    const row = document.createElement('div'); row.className = 'proj-row';
    row.innerHTML = `<span class="proj-icon">📄</span><span class="proj-name">${esc(proj.name)}</span><span class="proj-meta">${(proj.blocks||[]).length} blocks</span><span class="proj-arrow">→</span><button class="proj-del" onclick="deleteProject('${proj.id}',event)">×</button>`;
    row.addEventListener('click', () => openProjPage(proj.id));
    list.appendChild(row);
  });
}

function addProject() {
  const item = getSel(); if (!item) return;
  if (dirty) saveInterest(true);
  const proj = mkProject();
  item.projects.push(proj);
  dbSave(); renderProjects();
  openProjPage(proj.id);
}

function deleteProject(pid, e) {
  e.stopPropagation();
  const item = getSel(); if (!item) return;
  if (!confirm('Delete this project?')) return;
  item.projects = item.projects.filter(p => p.id !== pid);
  dbSave(); renderProjects();
}

// ─── SAVE INTEREST ────────────────────────────────────────────────────────────
// Only saves name, status, and links (cards write directly to state via oninput)
async function saveInterest(silent) {
  const item = getSel(); if (!item) return;
  item.name = document.getElementById('iTitle').value || 'Untitled';
  item.status = document.getElementById('iStatus').value;
  // collect link titles from DOM (urls already in state)
  document.getElementById('linksList').querySelectorAll('.link-row').forEach((row, i) => {
    if (item.links[i]) item.links[i].title = row.querySelector('.link-title')?.value || '';
  });
  // save note textarea if has content
  const notesTa = document.getElementById('noteInput');
  if (notesTa.value.trim()) saveNote();
  await dbSave();
  dirty = false; renderList();
  if (!silent) { const m = document.getElementById('savedMsg'); m.classList.add('on'); setTimeout(() => m.classList.remove('on'), 2000); }
}

// ─── PROJECT PAGE ─────────────────────────────────────────────────────────────
function openProjPage(pid) {
  projId = pid;
  const proj = getProj(); if (!proj) return;
  document.getElementById('projPage').classList.add('on');
  renderProjPage();
}

function closeProjPage() {
  saveProjPage();
  document.getElementById('projPage').classList.remove('on');
  projId = null;
  renderProjects();
}

function renderProjPage() {
  const proj = getProj(); if (!proj) return;
  const body = document.getElementById('projPageBody');
  body.innerHTML = '';

  const titleEl = document.createElement('input'); titleEl.className = 'proj-title';
  titleEl.value = proj.name; titleEl.placeholder = 'Project name…';
  titleEl.oninput = () => { proj.name = titleEl.value; };
  body.appendChild(titleEl);

  const blocksEl = document.createElement('div'); blocksEl.id = 'blocksEl';
  body.appendChild(blocksEl);
  renderBlocks();

  const addRow = document.createElement('div'); addRow.className = 'add-block-row';
  addRow.innerHTML = `
    <button class="add-block" onclick="addBlock('text')">✏️ Text</button>
    <button class="add-block" onclick="addBlock('heading')">H Heading</button>
    <button class="add-block" onclick="addBlock('checklist')">☑ Checklist</button>
    <button class="add-block" onclick="addBlock('link')">🔗 Link</button>
  `;
  body.appendChild(addRow);
}

function renderBlocks() {
  const proj = getProj(); if (!proj) return;
  const el = document.getElementById('blocksEl'); if (!el) return;
  el.innerHTML = '';
  proj.blocks.forEach((bl, i) => {
    const wrap = document.createElement('div'); wrap.className = 'block-wrap';
    const handle = document.createElement('span'); handle.className = 'block-handle'; handle.textContent = '⠿';
    const body = document.createElement('div'); body.className = 'block-body';
    const del = document.createElement('button'); del.className = 'block-del'; del.textContent = '×';
    del.onclick = () => { proj.blocks.splice(i, 1); renderBlocks(); };
    renderBlock(bl, body);
    wrap.appendChild(handle); wrap.appendChild(body); wrap.appendChild(del);
    el.appendChild(wrap);
  });
}

function renderBlock(bl, container) {
  container.innerHTML = '';
  if (bl.type === 'text') {
    const ta = document.createElement('textarea'); ta.className = 'b-text';
    ta.value = bl.text; ta.placeholder = 'Write something…'; ta.rows = 1;
    ta.oninput = () => { bl.text = ta.value; autoResize(ta); };
    container.appendChild(ta); setTimeout(() => autoResize(ta), 0);
  } else if (bl.type === 'heading') {
    const inp = document.createElement('input'); inp.className = 'b-heading';
    inp.value = bl.text; inp.placeholder = 'Heading';
    inp.oninput = () => { bl.text = inp.value; };
    container.appendChild(inp);
  } else if (bl.type === 'checklist') {
    const div = document.createElement('div'); div.className = 'b-checklist';
    (bl.items || []).forEach((ci, ci_i) => {
      const row = document.createElement('div'); row.className = 'b-check-row';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = ci.done;
      const txt = document.createElement('input'); txt.type = 'text'; txt.value = ci.text;
      txt.className = ci.done ? 'checked' : '';
      cb.onchange = () => { ci.done = cb.checked; txt.className = ci.done ? 'checked' : ''; };
      txt.oninput = () => { ci.text = txt.value; };
      const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '×';
      rm.onclick = () => { bl.items.splice(ci_i, 1); renderBlock(bl, container); };
      row.appendChild(cb); row.appendChild(txt); row.appendChild(rm);
      div.appendChild(row);
    });
    const addBtn = document.createElement('button'); addBtn.className = 'add-check'; addBtn.textContent = '+ Add item';
    addBtn.onclick = () => { bl.items.push({ id: uid(), text: '', done: false }); renderBlock(bl, container); setTimeout(() => { const rows = container.querySelectorAll('.b-check-row input[type=text]'); if (rows.length) rows[rows.length-1].focus(); }, 20); };
    div.appendChild(addBtn); container.appendChild(div);
  } else if (bl.type === 'link') {
    const box = document.createElement('div'); box.className = 'b-link-box';
    const inner = document.createElement('div'); inner.className = 'link-inner';
    const titleEl = document.createElement('input'); titleEl.className = 'b-link-title';
    titleEl.value = bl.title; titleEl.placeholder = 'Title (optional)';
    titleEl.oninput = () => { bl.title = titleEl.value; };
    inner.appendChild(titleEl);
    if (bl.url && bl.url.startsWith('http')) {
      const a = document.createElement('a'); a.className = 'b-link-display';
      a.href = bl.url; a.target = '_blank'; a.textContent = bl.url;
      inner.appendChild(a);
    } else {
      const urlEl = document.createElement('input'); urlEl.className = 'b-link-url';
      urlEl.value = bl.url; urlEl.placeholder = 'https://…';
      urlEl.oninput = () => { bl.url = urlEl.value; if (bl.url.startsWith('http') && bl.url.length > 10) renderBlock(bl, container); };
      inner.appendChild(urlEl);
    }
    const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '×';
    rm.onclick = () => { const proj = getProj(); if (!proj) return; proj.blocks = proj.blocks.filter(b => b.id !== bl.id); renderBlocks(); };
    box.appendChild(inner); box.appendChild(rm); container.appendChild(box);
  }
}

function addBlock(type) {
  const proj = getProj(); if (!proj) return;
  proj.blocks.push(mkBlock(type));
  renderBlocks();
  setTimeout(() => {
    const inputs = document.getElementById('blocksEl')?.querySelectorAll('input[type=text], textarea');
    if (inputs?.length) inputs[inputs.length-1].focus();
  }, 30);
}

function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

async function saveProjPage() {
  const proj = getProj(); if (!proj) return;
  const titleEl = document.querySelector('.proj-title');
  if (titleEl) proj.name = titleEl.value;
  const sync = document.getElementById('projSyncStatus');
  sync.textContent = 'Saving…';
  await dbSave();
  sync.textContent = 'Saved ✓';
  setTimeout(() => sync.textContent = '', 2000);
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    if (projId) saveProjPage(); else if (selId) saveInterest();
  }
});

// ─── START ────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/interests-tracker/sw.js');
boot();
</script>
</body>
</html>
