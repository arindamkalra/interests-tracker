<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tendr</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="shortcut icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#1a1a1a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ── TOKENS ── */
:root {
  --bg: #FDFCF9;
  --surface: #FFFFFF;
  --border: #EDE8E0;
  --border-light: #F5F1EC;
  --ink: #1C1C1C;
  --muted: #9A8F84;
  --faint: #C4BAB0;
  --accent: #1C1C1C;
  --accent-hover: #3A3A3A;
  --check: #4A7C59;
  --check-bg: #EDF5EF;
}

/* ── RESET ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

/* ── HEADER ── */
.app-header { padding: 13px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.app-title-wrap { display: flex; align-items: center; gap: 8px; }
.app-title { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: 400; color: #854F0B; letter-spacing: 3px; }
#globalSync { font-size: 11px; color: var(--faint); }

/* ── MAIN AREA ── */
.app-body { flex: 1; display: flex; overflow: hidden; }

/* ── BOTTOM NAV ── */
.bottom-nav { display: flex; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 10px 4px 12px; background: none; border: none; cursor: pointer; color: var(--faint); transition: color 0.2s; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.nav-btn.on { color: var(--ink); }
.nav-btn .nicon { font-size: 20px; }
.nav-btn .nlabel { font-size: 10px; font-weight: 500; letter-spacing: 0.3px; }

/* ── VIEWS ── */
.view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.view.on { display: flex; }

/* ══════════════════════════════════════
   INTERESTS VIEW
══════════════════════════════════════ */
.int-layout { display: flex; flex: 1; overflow: hidden; }

/* left panel */
.int-left { width: 240px; min-width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.int-left-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.int-left-header span { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.add-int-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.add-int-btn:hover { background: var(--accent-hover); }
.int-list { flex: 1; overflow-y: auto; padding: 6px; }
.int-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 9px; margin-bottom: 1px; border: 1px solid transparent; }
.int-item:hover { background: var(--bg); }
.int-item.on { background: var(--bg); border-color: var(--border); }
.int-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.active { background: #22c55e; } .dot.next { background: #f59e0b; } .dot.someday { background: #94a3b8; } .dot.archived { background: var(--border); }
.int-item .iname { flex: 1; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.int-item .idel { opacity: 0; background: none; border: none; color: var(--faint); cursor: pointer; font-size: 16px; padding: 0; }
.int-item:hover .idel { opacity: 1; }
.int-item .idel:hover { color: #c0392b; }

/* right panel */
.int-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.int-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--faint); gap: 8px; }
.int-empty .eicon { font-size: 32px; }
.int-empty p { font-size: 14px; }

/* interest detail */
.int-detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.int-detail-top { padding: 16px 24px 0; flex-shrink: 0; }
.back-btn { display: none; align-items: center; gap: 5px; background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 10px; }
.back-btn:hover { color: var(--ink); }
.int-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.int-title { font-size: 22px; font-weight: 700; border: none; background: none; outline: none; flex: 1; color: var(--ink); }
.int-title:focus { border-bottom: 2px solid var(--ink); }
.status-sel { font-size: 11px; font-weight: 600; border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; background: var(--surface); cursor: pointer; outline: none; color: var(--muted); flex-shrink: 0; }
.int-tabs { display: flex; border-bottom: 1px solid var(--border); }
.int-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; margin-bottom: -1px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.int-tab.on { color: var(--ink); border-bottom-color: var(--ink); }
.int-pane { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 18px 24px; gap: 18px; }
.int-pane.on { display: flex; }

.slabel { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin-bottom: 8px; }

/* note input */
.note-input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 14px; line-height: 1.6; resize: none; outline: none; background: var(--surface); color: var(--ink); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; min-height: 110px; }
.note-input:focus { border-color: var(--muted); }

/* note cards */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.note-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; position: relative; }
.note-card:hover { border-color: var(--muted); }
.note-card textarea { width: 100%; border: none; outline: none; resize: none; font-size: 13px; line-height: 1.55; color: var(--ink); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: transparent; min-height: 60px; }
.card-del { position: absolute; top: 6px; right: 6px; background: none; border: none; color: var(--faint); cursor: pointer; font-size: 14px; opacity: 0; }
.note-card:hover .card-del { opacity: 1; }
.card-del:hover { color: #c0392b; }

/* links */
.links-list { display: flex; flex-direction: column; gap: 8px; }
.link-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.link-row:hover { border-color: var(--muted); }
.link-inner { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.link-title-inp { border: none; outline: none; font-size: 13px; font-weight: 500; color: var(--ink); background: none; width: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.link-url-inp { border: none; outline: none; font-size: 11px; color: var(--muted); background: none; width: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.link-url-a { font-size: 11px; color: #4A7C8A; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.link-url-a:hover { text-decoration: underline; }
.link-del { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 15px; padding: 0; opacity: 0; flex-shrink: 0; }
.link-row:hover .link-del { opacity: 1; }
.link-del:hover { color: #c0392b; }
.add-link-btn { background: none; border: 1px dashed var(--border); border-radius: 8px; color: var(--faint); font-size: 13px; cursor: pointer; padding: 8px 12px; text-align: left; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.add-link-btn:hover { border-color: var(--muted); color: var(--muted); }

/* projects */
.proj-list { display: flex; flex-direction: column; gap: 8px; }
.proj-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; cursor: pointer; }
.proj-row:hover { border-color: var(--muted); background: var(--bg); }
.proj-row .pname { flex: 1; font-size: 14px; font-weight: 600; }
.proj-row .pmeta { font-size: 11px; color: var(--faint); }
.proj-row .parr { color: var(--faint); }
.proj-del-btn { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 15px; opacity: 0; padding: 0; }
.proj-row:hover .proj-del-btn { opacity: 1; }
.proj-del-btn:hover { color: #c0392b; }
.add-proj-btn { background: none; border: 1px dashed var(--border); border-radius: 10px; color: var(--faint); font-size: 13px; cursor: pointer; padding: 12px 16px; text-align: left; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.add-proj-btn:hover { border-color: var(--muted); color: var(--muted); }

/* save bar */
.int-save-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 10px 24px; border-top: 1px solid var(--border-light); flex-shrink: 0; background: var(--surface); }
.save-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 18px; font-size: 13px; cursor: pointer; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.save-btn:hover { background: var(--accent-hover); }
.saved-flash { font-size: 12px; color: var(--check); opacity: 0; transition: opacity 0.3s; }
.saved-flash.on { opacity: 1; }

/* project page overlay */
.proj-page { position: absolute; inset: 0; background: var(--surface); display: none; flex-direction: column; z-index: 10; }
.proj-page.on { display: flex; }
.proj-page-hdr { padding: 13px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.proj-page-back { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.proj-page-back:hover { color: var(--ink); }
#projSync { font-size: 11px; color: var(--faint); }
.proj-page-save { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 6px 16px; font-size: 13px; cursor: pointer; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.proj-page-save:hover { background: var(--accent-hover); }
.proj-page-body { flex: 1; overflow-y: auto; padding: 28px 44px; max-width: 740px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.proj-title-inp { font-size: 28px; font-weight: 700; border: none; outline: none; background: none; width: 100%; margin-bottom: 10px; color: var(--ink); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.proj-title-inp::placeholder { color: var(--border); }
.block-wrap { display: flex; align-items: flex-start; gap: 6px; padding: 2px 0; }
.block-handle { color: var(--border); font-size: 12px; cursor: grab; padding-top: 4px; opacity: 0; width: 14px; flex-shrink: 0; }
.block-wrap:hover .block-handle { opacity: 1; }
.block-body { flex: 1; min-width: 0; }
.block-del-btn { background: none; border: none; color: var(--border); cursor: pointer; font-size: 14px; padding: 0; opacity: 0; flex-shrink: 0; padding-top: 3px; }
.block-wrap:hover .block-del-btn { opacity: 1; }
.block-del-btn:hover { color: #c0392b; }
.b-text { width: 100%; border: none; outline: none; resize: none; font-size: 15px; line-height: 1.65; color: var(--ink); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: none; }
.b-text::placeholder { color: var(--faint); }
.b-heading { width: 100%; border: none; outline: none; font-size: 20px; font-weight: 700; color: var(--ink); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: none; }
.b-heading::placeholder { color: var(--border); }
.b-checklist { display: flex; flex-direction: column; gap: 5px; }
.b-check-row { display: flex; align-items: center; gap: 8px; }
.b-check-row input[type=checkbox] { accent-color: var(--ink); width: 15px; height: 15px; flex-shrink: 0; }
.b-check-row input[type=text] { flex: 1; border: none; outline: none; font-size: 15px; background: none; color: var(--ink); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.b-check-row input[type=text].checked { text-decoration: line-through; color: var(--muted); }
.b-check-row .brm { background: none; border: none; color: var(--border); cursor: pointer; font-size: 14px; padding: 0; opacity: 0; }
.b-check-row:hover .brm { opacity: 1; }
.add-check-btn { background: none; border: none; color: var(--faint); font-size: 13px; cursor: pointer; padding: 2px 0; text-align: left; margin-top: 2px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.add-check-btn:hover { color: var(--ink); }
.b-link-box { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.b-link-inner { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.b-link-title-inp { border: none; outline: none; font-size: 13px; font-weight: 500; color: var(--ink); background: none; width: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.b-link-url-inp { border: none; outline: none; font-size: 11px; color: var(--muted); background: none; width: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.b-link-a { font-size: 11px; color: #4A7C8A; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-link-a:hover { text-decoration: underline; }
.b-link-box .brm { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 14px; padding: 0; opacity: 0; }
.b-link-box:hover .brm { opacity: 1; }
.add-block-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 0; }
.add-block-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 12px; cursor: pointer; padding: 5px 10px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.add-block-btn:hover { border-color: var(--muted); color: var(--ink); background: var(--bg); }
.mini-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); flex-shrink: 0; white-space: nowrap; }
.archive-toggle-btn { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 7px; padding: 6px 14px; font-size: 12px; cursor: pointer; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.archive-toggle-btn:hover { border-color: var(--muted); color: var(--ink); }

/* ══════════════════════════════════════
   WELLNESS VIEW
══════════════════════════════════════ */
.wellness-wrap { flex: 1; overflow-y: auto; padding: 16px 20px 20px; max-width: 680px; width: 100%; margin: 0 auto; }
.well-date-bar { display: flex; justify-content: space-between; align-items: center; background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 16px; margin-bottom: 12px; }
.well-date-bar span { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; }
.well-reset-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; padding: 4px 11px; border-radius: 20px; font-size: 11px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; cursor: pointer; }
.well-reset-btn:hover { background: rgba(255,255,255,0.22); }
.well-progress-wrap { background: var(--border); border-radius: 99px; height: 5px; margin-bottom: 5px; overflow: hidden; }
.well-progress-fill { height: 100%; background: var(--ink); border-radius: 99px; transition: width 0.4s ease; }
.well-progress-label { text-align: right; font-size: 11px; color: var(--muted); margin-bottom: 14px; }
.well-block { background: var(--surface); border-radius: 14px; margin-bottom: 10px; overflow: hidden; border: 1px solid var(--border); }
.well-block-hdr { display: flex; align-items: center; gap: 9px; padding: 10px 14px 8px; border-bottom: 1px solid var(--border-light); }
.well-block-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--border); }
.well-block-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; flex: 1; }
.well-block-time { font-size: 10px; color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 20px; }
.well-item { display: flex; align-items: flex-start; gap: 11px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border-light); transition: background 0.15s; }
.well-item:last-child { border-bottom: none; }
.well-item:hover { background: var(--bg); }
.well-item.checked { background: var(--check-bg); }
.well-checkbox { width: 19px; height: 19px; border-radius: 5px; border: 2px solid var(--border); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; background: var(--surface); }
.well-item.checked .well-checkbox { background: var(--ink); border-color: var(--ink); }
.well-checkbox svg { opacity: 0; transform: scale(0.4); transition: all 0.2s; }
.well-item.checked .well-checkbox svg { opacity: 1; transform: scale(1); }
.well-item-text { font-size: 13px; line-height: 1.5; color: var(--ink); padding-top: 1px; transition: color 0.2s; }
.well-item.checked .well-item-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); }
.well-done-msg { display: none; text-align: center; padding: 16px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; color: var(--muted); }

/* ══════════════════════════════════════
   FOCUS VIEW
══════════════════════════════════════ */
.focus-wrap { flex: 1; overflow-y: auto; padding: 16px 20px 20px; max-width: 680px; width: 100%; margin: 0 auto; }

/* pomodoro */
.pom-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
.pom-stripe { display: none; }
.pom-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.pom-modes { display: flex; gap: 4px; }
.pom-mode { background: none; border: 1.5px solid var(--border); border-radius: 20px; font-size: 10px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: var(--muted); padding: 3px 9px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.pom-mode.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.pom-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pom-time { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 400; color: var(--ink); line-height: 1; letter-spacing: -1px; white-space: nowrap; }
.pom-sub { font-size: 10px; color: var(--muted); white-space: nowrap; }
.pom-actions { display: flex; gap: 5px; align-items: center; }
.pom-start { background: var(--ink); color: #fff; border: none; border-radius: 8px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; padding: 7px 14px; white-space: nowrap; }
.pom-start:hover { background: var(--accent-hover); }
.pom-reset { background: var(--bg); color: var(--muted); border: none; border-radius: 8px; width: 30px; height: 30px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.pom-reset:hover { background: var(--border); }
.pom-count { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.pom-prog-line { height: 3px; background: var(--border-light); }
.pom-prog-fill { height: 100%; background: var(--ink); transition: width 0.5s ease; border-radius: 0 2px 2px 0; }

/* tasks */
.focus-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
.focus-card-stripe { display: none; }
.focus-card-hdr { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 9px; border-bottom: 1px solid var(--border-light); }
.focus-card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); }
.focus-clear-btn { font-size: 10px; color: var(--muted); background: var(--bg); border: none; border-radius: 20px; padding: 3px 9px; cursor: pointer; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.focus-clear-btn:hover { background: var(--border); }
.focus-input-row { display: flex; gap: 7px; padding: 9px 12px; border-bottom: 1px solid var(--border-light); }
.focus-input { flex: 1; border: 1.5px solid var(--border); border-radius: 9px; padding: 7px 11px; font-size: 13px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); outline: none; }
.focus-input:focus { border-color: var(--muted); }
.focus-input::placeholder { color: var(--faint); }
.focus-add-btn { background: var(--accent); color: #fff; border: none; border-radius: 9px; width: 34px; height: 34px; font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.focus-add-btn:hover { background: var(--accent-hover); }
.focus-list { padding: 4px 0; min-height: 36px; }
.focus-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 12px; border-bottom: 1px solid var(--border-light); transition: background 0.15s; }
.focus-item:last-child { border-bottom: none; }
.focus-item:hover { background: var(--bg); }
.focus-item.done { background: var(--check-bg); }
.focus-cb { width: 17px; height: 17px; border-radius: 4px; border: 2px solid var(--border); flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.18s; background: var(--surface); }
.focus-item.done .focus-cb { background: var(--ink); border-color: var(--ink); }
.focus-cb svg { opacity: 0; transform: scale(0.4); transition: all 0.2s; }
.focus-item.done .focus-cb svg { opacity: 1; transform: scale(1); }
.focus-item-text { flex: 1; font-size: 13px; line-height: 1.5; color: var(--ink); word-break: break-word; padding-top: 1px; }
.focus-item.done .focus-item-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); }
.focus-item-del { background: none; border: none; color: var(--faint); font-size: 15px; cursor: pointer; padding: 0 2px; transition: color 0.15s; flex-shrink: 0; }
.focus-item-del:hover { color: #c0392b; }
.focus-empty { text-align: center; padding: 14px; font-size: 11.5px; color: var(--faint); font-style: italic; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

/* weekly goals */
.goal-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border-light); }
.goal-item:last-child { border-bottom: none; }
.goal-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; margin-top: 2px; font-size: 13px; color: var(--muted); transition: all 0.2s; }
.goal-item.achieved .goal-icon { background: var(--ink); border-color: var(--ink); color: #fff; }
.goal-main { flex: 1; min-width: 0; }
.goal-text { font-size: 13px; line-height: 1.4; color: var(--ink); margin-bottom: 7px; word-break: break-word; }
.goal-item.achieved .goal-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); }
.goal-slider-row { display: flex; align-items: center; gap: 8px; }
.goal-slider { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 99px; outline: none; cursor: pointer; background: var(--border); }
.goal-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--ink); cursor: pointer; }
.goal-pct { font-size: 11px; color: var(--muted); min-width: 32px; text-align: right; font-weight: 500; }
.goal-del-btn { background: none; border: none; color: var(--faint); font-size: 15px; cursor: pointer; padding: 0 2px; flex-shrink: 0; }
.goal-del-btn:hover { color: #c0392b; }
.goal-empty { text-align: center; padding: 16px; font-size: 11.5px; color: var(--faint); font-style: italic; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.week-prog-row { padding: 6px 14px 8px; display: flex; align-items: center; gap: 8px; }
.week-prog-bar { flex: 1; background: var(--border); border-radius: 99px; height: 4px; overflow: hidden; }
.week-prog-fill { height: 100%; background: var(--ink); border-radius: 99px; transition: width 0.4s ease; }
.week-prog-label { font-size: 10px; color: var(--muted); white-space: nowrap; }
.goal-input-row { display: flex; gap: 7px; padding: 9px 12px; border-bottom: 1px solid var(--border-light); }
.goal-input { flex: 1; border: 1.5px solid var(--border); border-radius: 9px; padding: 7px 11px; font-size: 13px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); outline: none; }
.goal-input:focus { border-color: var(--muted); }
.goal-add-btn { background: var(--accent); color: #fff; border: none; border-radius: 9px; width: 34px; height: 34px; font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.goal-add-btn:hover { background: var(--accent-hover); }

/* ── MOBILE ── */
@media (max-width: 640px) {
  .int-left { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid #e5e5e5; max-height: 40vh; flex-shrink: 0; }
  .int-left.hidden { display: none; }
  .int-layout { flex-direction: column; }
  .int-right { flex: 1; min-height: 0; }
  .int-pane { padding: 14px 16px; gap: 14px; }
  .int-detail-top { padding: 14px 16px 0; }
  .int-tabs { padding: 0; }
  .int-save-bar { padding: 10px 16px; }
  .back-btn { display: flex; }
  .cards-grid { grid-template-columns: 1fr; }
  .note-input { font-size: 16px; }
  .proj-page-body { padding: 20px 16px; }
  .idel, .link-del, .card-del, .proj-del-btn, .block-del-btn, .b-link-box .brm, .b-check-row .brm, .goal-del-btn, .focus-item-del { opacity: 1 !important; }
  .wellness-wrap, .focus-wrap { padding: 12px 14px 16px; }
  /* larger text for phone readability */
  .int-item .iname { font-size: 16px; }
  .int-title { font-size: 20px; }
  .note-input { font-size: 16px; line-height: 1.6; }
  .note-card textarea { font-size: 15px; }
  .well-item-text { font-size: 15px; line-height: 1.6; }
  .well-block-title { font-size: 16px; }
  .focus-item-text { font-size: 15px; }
  .goal-text { font-size: 15px; }
  .pom-time { font-size: 36px; }
  .focus-input, .goal-input { font-size: 16px; } /* prevent iOS zoom */
  .link-title-inp, .link-url-inp { font-size: 15px; }

  .nav-btn .nlabel { font-size: 11px; }
  .nav-btn .nicon { font-size: 22px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="app-header">
  <div class="app-title-wrap">
    <svg width="22" height="22" viewBox="0 0 154 122" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
      <ellipse cx="77" cy="100" rx="45" ry="15" fill="#FAEEDA" opacity="0.7"/>
      <path d="M57 130 C57 130 20 105 20 72 C20 50 35 34 50 28 C44 46 52 54 58 52 C52 38 62 18 80 8 C76 30 86 44 94 50 C98 36 106 28 114 26 C128 42 134 62 134 80 C134 110 100 130 100 130 C96 112 86 102 78 102 C70 102 62 112 57 130Z" fill="#EF9F27" opacity="0.9" transform="translate(-3,-8)"/>

<!-- MAIN BODY -->
<div class="app-body">

  <!-- ═══ PARA VIEW ═══ -->
  <div class="view" id="view-interests">
    <div class="int-layout">
      <div class="int-left" id="intLeft">

          <div class="int-tabs" id="paraTabs">

            <button class="int-tab" data-sec="areas" onclick="paraSwitchSection('areas')">Areas</button>
            <button class="int-tab" data-sec="resources" onclick="paraSwitchSection('resources')">Resources</button>
            <button class="int-tab" data-sec="archive" onclick="paraSwitchSection('archive')">Archive</button>

          <button class="add-int-btn" id="paraAddBtn" onclick="paraAddClick()">+ Project</button>
        </div>
        <div class="int-list" id="intList"></div>

      <div class="int-right" id="intRight">
        <div class="int-empty" id="intEmpty">
          <div class="eicon">✦</div>
          <p id="intEmptyMsg">Select a project or add a new one</p>
        </div>
        <div class="proj-page" id="projPage">

            <button class="archive-toggle-btn" id="archiveToggleBtn" onclick="toggleArchive()">Archive</button>

          <div class="proj-page-body" id="projPageBody"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ WELLNESS VIEW ═══ -->
  <div class="view" id="view-wellness">
    <div class="wellness-wrap">
      <div class="well-date-bar">
        <span id="wellDate">Today</span>
        <button class="well-reset-btn" onclick="wellReset()">↺ Reset Day</button>
      </div>
      <div class="well-progress-wrap"><div class="well-progress-fill" id="wellProgFill" style="width:0%"></div></div>
      <div class="well-progress-label" id="wellProgLabel">0 / 0 done</div>
      <div id="wellChecklist"></div>
      <div class="well-done-msg" id="wellDoneMsg">🌿 Full day complete. Well done.</div>
    </div>
  </div>

  <!-- ═══ FOCUS VIEW ═══ -->
  <div class="view on" id="view-focus">
    <div class="focus-wrap">

      <!-- Pomodoro -->

        <div class="pom-bar">

            <button class="pom-mode" data-mode="short" onclick="pomSetMode('short')">Short</button>
            <button class="pom-mode" data-mode="long" onclick="pomSetMode('long')">Long</button>
          </div>
          <div class="pom-center">

            <div class="pom-sub" id="pomSub">Ready to focus?</div>

          <div class="pom-actions">
            <button class="pom-start" id="pomStartBtn" onclick="pomToggle()">Start</button>
            <button class="pom-reset" onclick="pomReset()">↺</button>
          </div>
          <div class="pom-count">🍅 <span id="pomCount">0</span></div>

      <!-- Tasks -->
      <div class="focus-card">

        <div class="focus-card-hdr">
          <span class="focus-card-title">📋 Tasks</span>
          <button class="focus-clear-btn" onclick="taskClearDone()">Clear done</button>
        </div>
        <div class="focus-input-row">
          <input class="focus-input" id="taskInput" placeholder="Add a task…" onkeydown="if(event.key==='Enter') taskAdd()">
          <button class="focus-add-btn" onclick="taskAdd()">+</button>
        </div>
        <div class="focus-list" id="taskList"></div>
      </div>

      <!-- Weekly Goals -->
      <div class="focus-card">
        <div class="focus-card-stripe" style="background:linear-gradient(90deg,#9B84C4,#C4AEE8)"></div>
        <div class="focus-card-hdr">
          <span class="focus-card-title">🌱 Weekly Goals</span>
        </div>
        <div class="week-prog-row">
          <div class="week-prog-bar"><div class="week-prog-fill" id="weekProgFill" style="width:0%"></div></div>
          <span class="week-prog-label" id="weekProgLabel">0 achieved</span>
        </div>
        <div class="goal-input-row">
          <input class="goal-input" id="goalInput" placeholder="Set a goal for this week…" onkeydown="if(event.key==='Enter') goalAdd()">
          <button class="goal-add-btn" onclick="goalAdd()">+</button>
        </div>
        <div id="goalList"></div>
      </div>

    </div>
  </div>

</div><!-- /app-body -->

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn" data-view="interests" onclick="switchView('interests')">
    <span class="nicon">🗺</span><span class="nlabel">Plan</span>
  </button>
  <button class="nav-btn" data-view="wellness" onclick="switchView('wellness')">
    <span class="nicon">🌿</span><span class="nlabel">Wellness</span>
  </button>
  <button class="nav-btn on" data-view="focus" onclick="switchView('focus')">
    <span class="nicon">🍅</span><span class="nlabel">Focus</span>
  </button>
</nav>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const SB_URL = 'https://iykbcnwkbxeadekfaaac.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5a2JjbndrYnhlYWRla2ZhYWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0Mjg4MDEsImV4cCI6MjEwMTAwNDgwMX0.CvKoIS8F-xqLFId9dGcLKJOQrlmYT1VQIwgPHCsldvA';
const SB_HDR = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' };
const USER_ID = 'arindam';

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isMobile = () => window.innerWidth <= 640;
const todayStr = () => new Date().toISOString().slice(0,10);
const URL_RE = () => /https?:\/\/[^\s"'<>]+/g;

function sync(msg) { document.getElementById('globalSync').textContent = msg; }
function flashSaved(id) { const el = document.getElementById(id); el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 2000); }

// ═══════════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════════
function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + view));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  if (view === 'wellness') wellRender();
  if (view === 'focus') { taskRender(); goalRender(); }
}

// ═══════════════════════════════════════════════════════════
// PARA DATA MODEL
// ═══════════════════════════════════════════════════════════
let paraData = { projects: [], areas: [], resources: [] };
let curSection = 'projects';
let curEntityType = null;
let curEntityId = null;

async function paraDbLoad() {
  const res = await fetch(`${SB_URL}/rest/v1/interests?id=eq.main&user_id=eq.${USER_ID}`, { headers: SB_HDR });
  const rows = await res.json();
  return rows[0]?.data || null;
}

async function paraDbSave() {
  sync('Saving…');
  const res = await fetch(`${SB_URL}/rest/v1/interests`, {
    method: 'POST', headers: SB_HDR,
    body: JSON.stringify({ id: 'main', user_id: USER_ID, data: paraData, updated_at: new Date().toISOString() })
  });
  sync(res.ok ? '' : '⚠️ Save failed');
  if (!res.ok) console.error('para save failed', res.status);
}

// ═══════════════════════════════════════════════════════════
// SUPABASE — WELLNESS
// ═══════════════════════════════════════════════════════════
let wellnessData = { checklistState: {}, tasks: [], goals: [] };

async function wellDbLoad() {
  const res = await fetch(`${SB_URL}/rest/v1/wellness?id=eq.main&user_id=eq.${USER_ID}`, { headers: SB_HDR });
  const rows = await res.json();
  return rows[0]?.data || null;
}

async function wellDbSave() {
  sync('Saving…');
  const res = await fetch(`${SB_URL}/rest/v1/wellness`, {
    method: 'POST', headers: SB_HDR,
    body: JSON.stringify({ id: 'main', user_id: USER_ID, data: wellnessData, updated_at: new Date().toISOString() })
  });
  sync(res.ok ? '' : '⚠️ Save failed');
  if (!res.ok) console.error('wellness save failed', res.status);
}

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
async function boot() {
  sync('Loading…');

  const saved = await paraDbLoad();
  if (saved) {
    paraData = {
      projects: saved.projects || [],
      areas: saved.areas || [],
      resources: saved.resources || []
    };
  } else {
    paraData = {
      projects: [],
      areas: ['Cooking','Baking','Embroidery','Pottery','Hiking'].map(name => ({ id: uid(), name, archived: false, blocks: [] })),
      resources: []
    };
    await paraDbSave();
  }
  renderParaList();

  const savedWell = await wellDbLoad();
  if (savedWell) {
    wellnessData = { checklistState: savedWell.checklistState || {}, tasks: savedWell.tasks || [], goals: savedWell.goals || [] };
  } else {
    wellnessData = { checklistState: {}, tasks: [], goals: [] };
    await wellDbSave();
  }

  sync('');
}

// ═══════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
// PARA — SECTION SWITCHING
// ═══════════════════════════════════════════════════════════
function paraSwitchSection(sec) {
  curSection = sec;
  document.querySelectorAll('#paraTabs .int-tab').forEach(b => b.classList.toggle('on', b.dataset.sec === sec));
  const addBtn = document.getElementById('paraAddBtn');
  const labels = { projects: '+ Project', areas: '+ Area', resources: '+ Link', archive: '' };
  addBtn.textContent = labels[sec];
  addBtn.style.display = sec === 'archive' ? 'none' : 'block';
  const emptyMsgs = { projects: 'Select a project or add a new one', areas: 'Select an area or add a new one', resources: 'No resources yet — add one below', archive: 'Nothing archived yet' };
  document.getElementById('intEmptyMsg').textContent = emptyMsgs[sec];
  renderParaList();
}

function paraAddClick() {
  if (curSection === 'projects') addProjectEntity();
  else if (curSection === 'areas') addAreaEntity();
  else if (curSection === 'resources') addResourceRow();
}

// ═══════════════════════════════════════════════════════════
// PARA — LIST RENDERING
// ═══════════════════════════════════════════════════════════
function renderParaList() {
  const list = document.getElementById('intList'); list.innerHTML = '';
  if (curSection === 'projects') renderEntityRows('projects');
  else if (curSection === 'areas') renderEntityRows('areas');
  else if (curSection === 'resources') renderResourceRows();
  else if (curSection === 'archive') renderArchiveRows();
}

function renderEntityRows(type) {
  const list = document.getElementById('intList');
  paraData[type].filter(e => !e.archived).forEach(ent => {
    const div = document.createElement('div'); div.className = 'int-item';
    const areaName = (type === 'projects' && ent.areaId) ? (paraData.areas.find(a => a.id === ent.areaId)?.name || '') : '';
    div.innerHTML = `<span class="iname">${esc(ent.name)}</span>${areaName ? `<span class="mini-tag">${esc(areaName)}</span>` : ''}<button class="idel" onclick="deleteEntity('${type}','${ent.id}',event)">×</button>`;
    div.addEventListener('click', () => openEntityPage(type, ent.id));
    list.appendChild(div);
  });
}

function renderResourceRows() {
  const list = document.getElementById('intList');
  paraData.resources.forEach((r, i) => {
    const row = document.createElement('div'); row.className = 'link-row';
    const isUrl = (r.url || '').startsWith('http');
    row.innerHTML = `
      <div class="link-inner">
        <input class="link-title-inp" placeholder="Title" value="${esc(r.title || '')}">
        ${isUrl ? `<a class="link-url-a" href="${esc(r.url)}" target="_blank">${esc(r.url)}</a>` : `<input class="link-url-inp" placeholder="https://…" value="${esc(r.url || '')}">`}
      </div>
      <button class="link-del" onclick="removeResource(${i})">×</button>
    `;
    const titleInp = row.querySelector('.link-title-inp');
    titleInp.oninput = () => { r.title = titleInp.value; paraDbSave(); };
    const urlInp = row.querySelector('.link-url-inp');
    if (urlInp) urlInp.oninput = () => { r.url = urlInp.value; if (r.url.startsWith('http') && r.url.length > 10) { paraDbSave(); renderResourceRows(); } };
    list.appendChild(row);
  });
}

function renderArchiveRows() {
  const list = document.getElementById('intList');
  const rows = [
    ...paraData.projects.filter(p => p.archived).map(p => ({ ...p, _type: 'projects', _label: 'Project' })),
    ...paraData.areas.filter(a => a.archived).map(a => ({ ...a, _type: 'areas', _label: 'Area' }))
  ];
  rows.forEach(ent => {
    const div = document.createElement('div'); div.className = 'int-item';
    div.innerHTML = `<span class="iname">${esc(ent.name)}</span><span class="mini-tag">${ent._label}</span><button class="idel" onclick="deleteEntity('${ent._type}','${ent.id}',event)">×</button>`;
    div.addEventListener('click', () => openEntityPage(ent._type, ent.id));
    list.appendChild(div);
  });
}

// ═══════════════════════════════════════════════════════════
// PARA — ADD / DELETE
// ═══════════════════════════════════════════════════════════
function addProjectEntity() {
  const p = { id: uid(), name: 'New project', areaId: null, archived: false, blocks: [] };
  paraData.projects.unshift(p); paraDbSave(); openEntityPage('projects', p.id);
  setTimeout(() => document.querySelector('.proj-title-inp')?.select(), 50);
}

function addAreaEntity() {
  const a = { id: uid(), name: 'New area', archived: false, blocks: [] };
  paraData.areas.unshift(a); paraDbSave(); openEntityPage('areas', a.id);
  setTimeout(() => document.querySelector('.proj-title-inp')?.select(), 50);
}

function addResourceRow() {
  paraData.resources.unshift({ id: uid(), title: '', url: '' });
  paraDbSave(); renderResourceRows();
  setTimeout(() => { const ins = document.querySelectorAll('#intList .link-title-inp'); if (ins.length) ins[0].focus(); }, 30);
}

function removeResource(i) {
  paraData.resources.splice(i, 1);
  paraDbSave(); renderResourceRows();
}

function deleteEntity(type, id, e) {
  e.stopPropagation();
  if (!confirm('Delete this permanently?')) return;
  paraData[type] = paraData[type].filter(x => x.id !== id);
  paraDbSave(); renderParaList();
}

// ═══════════════════════════════════════════════════════════
// PARA — ENTITY PAGE (project or area detail, shared block editor)
// ═══════════════════════════════════════════════════════════
function getEntity() {
  if (!curEntityType) return null;
  const arr = paraData[curEntityType];
  return arr ? arr.find(x => x.id === curEntityId) : null;
}

function openEntityPage(type, id) {
  curEntityType = type; curEntityId = id;
  document.getElementById('projPage').classList.add('on');
  renderEntityPage();
}

function closeEntityPage() {
  saveEntityPage();
  document.getElementById('projPage').classList.remove('on');
  curEntityType = null; curEntityId = null;
  renderParaList();
}

function renderEntityPage() {
  const ent = getEntity(); if (!ent) return;
  document.getElementById('archiveToggleBtn').textContent = ent.archived ? 'Unarchive' : 'Archive';
  const body = document.getElementById('projPageBody'); body.innerHTML = '';
  const titleEl = document.createElement('input'); titleEl.className = 'proj-title-inp';
  titleEl.value = ent.name; titleEl.placeholder = curEntityType === 'projects' ? 'Project name…' : 'Area name…';
  titleEl.oninput = () => { ent.name = titleEl.value; };
  body.appendChild(titleEl);

  if (curEntityType === 'projects') {
    const sel = document.createElement('select'); sel.className = 'status-sel'; sel.style.marginBottom = '14px';
    const noneOpt = document.createElement('option'); noneOpt.value = ''; noneOpt.textContent = 'No area'; sel.appendChild(noneOpt);
    paraData.areas.filter(a => !a.archived).forEach(a => {
      const opt = document.createElement('option'); opt.value = a.id; opt.textContent = a.name;
      if (ent.areaId === a.id) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = () => { ent.areaId = sel.value || null; paraDbSave(); };
    body.appendChild(sel);
  }

  const blocksEl = document.createElement('div'); blocksEl.id = 'entityBlocksEl';
  body.appendChild(blocksEl);
  renderEntityBlocks();
  const addRow = document.createElement('div'); addRow.className = 'add-block-row';
  ['text','heading','checklist','link'].forEach(type => {
    const labels = { text:'✏️ Text', heading:'H Heading', checklist:'☑ Checklist', link:'🔗 Link' };
    const btn = document.createElement('button'); btn.className = 'add-block-btn';
    btn.textContent = labels[type]; btn.onclick = () => entityAddBlock(type);
    addRow.appendChild(btn);
  });
  body.appendChild(addRow);
}

function renderEntityBlocks() {
  const ent = getEntity(); if (!ent) return;
  const el = document.getElementById('entityBlocksEl'); if (!el) return;
  el.innerHTML = '';
  (ent.blocks || []).forEach((bl, i) => {
    const wrap = document.createElement('div'); wrap.className = 'block-wrap';
    const handle = document.createElement('span'); handle.className = 'block-handle'; handle.textContent = '⠿';
    const body = document.createElement('div'); body.className = 'block-body';
    const del = document.createElement('button'); del.className = 'block-del-btn'; del.textContent = '×';
    del.onclick = () => { ent.blocks.splice(i, 1); renderEntityBlocks(); };
    renderEntityBlock(bl, body);
    wrap.appendChild(handle); wrap.appendChild(body); wrap.appendChild(del);
    el.appendChild(wrap);
  });
}

function renderEntityBlock(bl, container) {
  container.innerHTML = '';
  if (bl.type === 'text') {
    const ta = document.createElement('textarea'); ta.className = 'b-text';
    ta.value = bl.text; ta.placeholder = 'Write something…'; ta.rows = 1;
    ta.oninput = () => { bl.text = ta.value; autoResize(ta); };
    container.appendChild(ta); setTimeout(() => autoResize(ta), 0);
  } else if (bl.type === 'heading') {
    const inp = document.createElement('input'); inp.className = 'b-heading';
    inp.value = bl.text; inp.placeholder = 'Heading';
    inp.oninput = () => { bl.text = inp.value; };
    container.appendChild(inp);
  } else if (bl.type === 'checklist') {
    const div = document.createElement('div'); div.className = 'b-checklist';
    (bl.items||[]).forEach((ci, ci_i) => {
      const row = document.createElement('div'); row.className = 'b-check-row';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = ci.done;
      const txt = document.createElement('input'); txt.type = 'text'; txt.value = ci.text;
      txt.className = ci.done ? 'checked' : '';
      cb.onchange = () => { ci.done = cb.checked; txt.className = ci.done ? 'checked' : ''; };
      txt.oninput = () => { ci.text = txt.value; };
      const rm = document.createElement('button'); rm.className = 'brm'; rm.textContent = '×';
      rm.onclick = () => { bl.items.splice(ci_i, 1); renderEntityBlock(bl, container); };
      row.appendChild(cb); row.appendChild(txt); row.appendChild(rm); div.appendChild(row);
    });
    const addBtn = document.createElement('button'); addBtn.className = 'add-check-btn'; addBtn.textContent = '+ Add item';
    addBtn.onclick = () => {
      bl.items.push({ id: uid(), text: '', done: false }); renderEntityBlock(bl, container);
      setTimeout(() => { const rows = container.querySelectorAll('.b-check-row input[type=text]'); if (rows.length) rows[rows.length-1].focus(); }, 20);
    };
    div.appendChild(addBtn); container.appendChild(div);
  } else if (bl.type === 'link') {
    const box = document.createElement('div'); box.className = 'b-link-box';
    const inner = document.createElement('div'); inner.className = 'b-link-inner';
    const titleEl = document.createElement('input'); titleEl.className = 'b-link-title-inp';
    titleEl.value = bl.title; titleEl.placeholder = 'Title (optional)';
    titleEl.oninput = () => { bl.title = titleEl.value; };
    inner.appendChild(titleEl);
    if (bl.url && bl.url.startsWith('http')) {
      const a = document.createElement('a'); a.className = 'b-link-a'; a.href = bl.url; a.target = '_blank'; a.textContent = bl.url;
      inner.appendChild(a);
    } else {
      const urlEl = document.createElement('input'); urlEl.className = 'b-link-url-inp';
      urlEl.value = bl.url; urlEl.placeholder = 'https://…';
      urlEl.oninput = () => { bl.url = urlEl.value; if (bl.url.startsWith('http') && bl.url.length > 10) renderEntityBlock(bl, container); };
      inner.appendChild(urlEl);
    }
    const rm = document.createElement('button'); rm.className = 'brm'; rm.textContent = '×';
    rm.onclick = () => { const e2 = getEntity(); if (e2) { e2.blocks = e2.blocks.filter(b => b.id !== bl.id); renderEntityBlocks(); } };
    box.appendChild(inner); box.appendChild(rm); container.appendChild(box);
  }
}

function entityAddBlock(type) {
  const ent = getEntity(); if (!ent) return;
  const bl = { id: uid(), type };
  if (type === 'text' || type === 'heading') bl.text = '';
  if (type === 'checklist') bl.items = [];
  if (type === 'link') { bl.url = ''; bl.title = ''; }
  ent.blocks = ent.blocks || []; ent.blocks.push(bl); renderEntityBlocks();
  setTimeout(() => { const ins = document.getElementById('entityBlocksEl')?.querySelectorAll('input[type=text],textarea'); if (ins?.length) ins[ins.length-1].focus(); }, 30);
}

function toggleArchive() {
  const ent = getEntity(); if (!ent) return;
  ent.archived = !ent.archived;
  closeEntityPage();
}

async function saveEntityPage() {
  const ent = getEntity(); if (!ent) return;
  const titleEl = document.querySelector('.proj-title-inp'); if (titleEl) ent.name = titleEl.value || 'Untitled';
  const sync = document.getElementById('projSync'); sync.textContent = 'Saving…';
  await paraDbSave();
  sync.textContent = 'Saved ✓'; setTimeout(() => sync.textContent = '', 2000);
}

function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

// ═══════════════════════════════════════════════════════════
// WELLNESS — CHECKLIST DATA
// ═══════════════════════════════════════════════════════════
const WELL_BLOCKS = [
  { emoji:"🌅", title:"Morning", time:"9:30 am", color:"#E8B86D", items:["2 glasses of water immediately on waking 💧💧","20 min morning meditation 🧘","30 min — stretch & strengthen ankles/hips 🦵"] },
  { emoji:"🎵", title:"Music & Poetry Ritual", time:"10 am", color:"#B87A4A", items:["15 mins — start with a singing practice 🎤","10 min — learn something new 📚","1 hour — write or journal, then learn to write; record your purpose in your notes ✍️","2 hours — free reading and music practice 📖🎸"] },
  { emoji:"☀️", title:"Mid-Morning", time:"12 pm", color:"#F2A65A", items:["2 glasses of water 💧💧","A cup of coffee ☕","Protein-first breakfast — eggs, paneer, or curd 🍳"] },
  { emoji:"🍽️", title:"Lunch", time:"2:30 pm", color:"#7DBF8E", items:["1–2 glasses of water before eating 💧💧","Include dal/sabzi, curd, and salad alongside carbs","10–15 min walk after lunch 🎧 audiobook on"] },
  { emoji:"🌆", title:"Evening", time:"6 pm", color:"#9B84C4", items:["4 glasses of water 💧💧💧💧","Coffee + nuts ☕🥜 (fuel for the late night)"] },
  { emoji:"🍽️", title:"Dinner", time:"9 – 10 pm", color:"#E07B7B", items:["1–2 glasses of water before eating 💧💧","Cook a meal and feed Frost 🐱","Nothing heavy after 10 pm","Call someone you love. Tell them one real thing about your day or play something with them 🤍"] },
  { emoji:"📖", title:"Wind Down", time:"1:30 am", color:"#6A8FAF", items:["Read a book — paper preferred, no screens 30 mins before bed","20 min wind down meditation — observe your body 🧘","Sleep by 2:30 am — protect your 7 hours"] }
];

// ═══════════════════════════════════════════════════════════
// WELLNESS — RENDER
// ═══════════════════════════════════════════════════════════
function wellRender() {
  const today = todayStr();
  const state = wellnessData.checklistState[today] || {};
  const container = document.getElementById('wellChecklist'); container.innerHTML = '';
  let total = 0, done = 0;

  WELL_BLOCKS.forEach((block, bi) => {
    const blockEl = document.createElement('div'); blockEl.className = 'well-block';
    const hdr = document.createElement('div'); hdr.className = 'well-block-hdr';
    hdr.innerHTML = `<div class="well-block-dot" style="background:${block.color}"></div><div class="well-block-title">${block.emoji} ${block.title}</div><div class="well-block-time">${block.time}</div>`;
    blockEl.appendChild(hdr);

    block.items.forEach((text, ii) => {
      const key = `b${bi}_i${ii}`;
      const isChecked = !!state[key];
      total++; if (isChecked) done++;
      const item = document.createElement('div'); item.className = 'well-item' + (isChecked ? ' checked' : '');
      item.innerHTML = `<div class="well-checkbox"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 3.5L3.5 6.5L9 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="well-item-text">${text}</div>`;
      item.onclick = () => {
        wellnessData.checklistState[today] = wellnessData.checklistState[today] || {};
        wellnessData.checklistState[today][key] = !wellnessData.checklistState[today][key];
        wellDbSave(); wellRender();
      };
      blockEl.appendChild(item);
    });
    container.appendChild(blockEl);
  });

  const pct = total > 0 ? Math.round((done/total)*100) : 0;
  document.getElementById('wellProgFill').style.width = pct + '%';
  document.getElementById('wellProgLabel').textContent = `${done} / ${total} done`;
  document.getElementById('wellDoneMsg').style.display = (done === total && total > 0) ? 'block' : 'none';
  document.getElementById('wellDate').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long' });
}

function wellReset() {
  if (!confirm('Reset all checkboxes for today?')) return;
  const today = todayStr();
  wellnessData.checklistState[today] = {};
  wellDbSave(); wellRender();
}

// ═══════════════════════════════════════════════════════════
// POMODORO (localStorage only — session-based)
// ═══════════════════════════════════════════════════════════
const POM_MODES = { work: 25*60, short: 5*60, long: 15*60 };
const POM_SUBS = { work:'Stay in flow 🌱', short:'Breathe. Stretch.', long:'Rest well 🍵' };
let pomMode = 'work', pomLeft = POM_MODES.work, pomTotal = POM_MODES.work;
let pomRunning = false, pomInterval = null;
let pomCount = parseInt(localStorage.getItem('pom_' + todayStr()) || '0');

function pomSetMode(mode) {
  if (pomRunning) { clearInterval(pomInterval); pomRunning = false; }
  pomMode = mode; pomLeft = pomTotal = POM_MODES[mode];
  document.getElementById('pomStartBtn').textContent = 'Start';
  document.getElementById('pomSub').textContent = 'Ready?';
  document.querySelectorAll('.pom-mode').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  pomUpdateDisplay();
}

function pomToggle() {
  if (pomRunning) {
    clearInterval(pomInterval); pomRunning = false;
    document.getElementById('pomStartBtn').textContent = 'Resume';
    document.getElementById('pomSub').textContent = 'Paused';
  } else {
    pomRunning = true;
    document.getElementById('pomStartBtn').textContent = 'Pause';
    document.getElementById('pomSub').textContent = POM_SUBS[pomMode];
    pomInterval = setInterval(() => {
      if (pomLeft <= 0) {
        clearInterval(pomInterval); pomRunning = false;
        document.getElementById('pomStartBtn').textContent = 'Start';
        if (pomMode === 'work') {
          pomCount++; localStorage.setItem('pom_' + todayStr(), pomCount);
          document.getElementById('pomSub').textContent = '🎉 Session done!';
        } else { document.getElementById('pomSub').textContent = '✓ Break over'; }
        pomUpdateDisplay();
      } else { pomLeft--; pomUpdateDisplay(); }
    }, 1000);
  }
}

function pomReset() {
  clearInterval(pomInterval); pomRunning = false; pomLeft = pomTotal;
  document.getElementById('pomStartBtn').textContent = 'Start';
  document.getElementById('pomSub').textContent = 'Ready?';
  pomUpdateDisplay();
}

function pomUpdateDisplay() {
  const m = String(Math.floor(pomLeft/60)).padStart(2,'0');
  const s = String(pomLeft%60).padStart(2,'0');
  document.getElementById('pomTime').textContent = `${m}:${s}`;
  document.getElementById('pomCount').textContent = pomCount;
  document.getElementById('pomProgFill').style.width = ((pomTotal-pomLeft)/pomTotal*100) + '%';
}

// ═══════════════════════════════════════════════════════════
// TASKS (persists in wellnessData)
// ═══════════════════════════════════════════════════════════
function taskAdd() {
  const inp = document.getElementById('taskInput');
  const text = inp.value.trim(); if (!text) return;
  wellnessData.tasks.push({ id: uid(), text, done: false });
  inp.value = '';
  wellDbSave(); taskRender();
}

function taskToggle(id) {
  const t = wellnessData.tasks.find(t => t.id === id); if (!t) return;
  t.done = !t.done; wellDbSave(); taskRender();
}

function taskDelete(id) {
  wellnessData.tasks = wellnessData.tasks.filter(t => t.id !== id);
  wellDbSave(); taskRender();
}

function taskClearDone() {
  wellnessData.tasks = wellnessData.tasks.filter(t => !t.done);
  wellDbSave(); taskRender();
}

function taskRender() {
  const list = document.getElementById('taskList'); list.innerHTML = '';
  if (!wellnessData.tasks.length) { list.innerHTML = '<div class="focus-empty">No tasks yet</div>'; return; }
  wellnessData.tasks.forEach(t => {
    const el = document.createElement('div'); el.className = 'focus-item' + (t.done ? ' done' : '');
    const cb = document.createElement('div'); cb.className = 'focus-cb';
    cb.innerHTML = '<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 3.5L3.5 6.5L9 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    cb.onclick = () => taskToggle(t.id);
    const txt = document.createElement('div'); txt.className = 'focus-item-text'; txt.textContent = t.text;
    const del = document.createElement('button'); del.className = 'focus-item-del'; del.textContent = '×';
    del.onclick = () => taskDelete(t.id);
    el.appendChild(cb); el.appendChild(txt); el.appendChild(del);
    list.appendChild(el);
  });
}

// ═══════════════════════════════════════════════════════════
// WEEKLY GOALS (persists in wellnessData)
// ═══════════════════════════════════════════════════════════
function goalAdd() {
  const inp = document.getElementById('goalInput');
  const text = inp.value.trim(); if (!text) return;
  wellnessData.goals.push({ id: uid(), text, pct: 0, achieved: false });
  inp.value = '';
  wellDbSave(); goalRender();
}

function goalSetPct(id, pct) {
  const g = wellnessData.goals.find(g => g.id === id); if (!g) return;
  g.pct = pct; g.achieved = pct >= 100;
  wellDbSave(); goalUpdateHeader();
  // update just the item's achieved class without full re-render
  const el = document.getElementById('gitem-' + id); if (!el) return;
  el.className = 'goal-item' + (g.achieved ? ' achieved' : '');
  const icon = el.querySelector('.goal-icon'); if (icon) { icon.textContent = g.achieved ? '✓' : '◎'; }
  const lbl = el.querySelector('.goal-pct'); if (lbl) lbl.textContent = pct + '%';
}

function goalToggle(id) {
  const g = wellnessData.goals.find(g => g.id === id); if (!g) return;
  const newPct = g.achieved ? 0 : 100;
  g.pct = newPct; g.achieved = !g.achieved;
  wellDbSave(); goalRender();
}

function goalDelete(id) {
  wellnessData.goals = wellnessData.goals.filter(g => g.id !== id);
  wellDbSave(); goalRender();
}

function goalUpdateHeader() {
  const goals = wellnessData.goals;
  if (!goals.length) { document.getElementById('weekProgFill').style.width = '0%'; document.getElementById('weekProgLabel').textContent = '0 achieved'; return; }
  const avg = Math.round(goals.reduce((s,g) => s + (g.pct||0), 0) / goals.length);
  const achieved = goals.filter(g => g.achieved).length;
  document.getElementById('weekProgFill').style.width = avg + '%';
  document.getElementById('weekProgLabel').textContent = `${achieved} / ${goals.length} done · ${avg}% avg`;
}

function goalRender() {
  const list = document.getElementById('goalList'); list.innerHTML = '';
  if (!wellnessData.goals.length) { list.innerHTML = '<div class="goal-empty">No goals yet — what do you want to accomplish?</div>'; goalUpdateHeader(); return; }
  goalUpdateHeader();
  wellnessData.goals.forEach(g => {
    const el = document.createElement('div'); el.className = 'goal-item' + (g.achieved ? ' achieved' : ''); el.id = 'gitem-' + g.id;
    const icon = document.createElement('div'); icon.className = 'goal-icon'; icon.textContent = g.achieved ? '✓' : '◎';
    icon.onclick = () => goalToggle(g.id);
    const main = document.createElement('div'); main.className = 'goal-main';
    const txt = document.createElement('div'); txt.className = 'goal-text'; txt.textContent = g.text;
    const sliderRow = document.createElement('div'); sliderRow.className = 'goal-slider-row';
    const slider = document.createElement('input'); slider.type = 'range'; slider.min = 0; slider.max = 100; slider.step = 5;
    slider.value = g.pct; slider.className = 'goal-slider'; slider.id = 'gslider-' + g.id;
    goalUpdateSliderBg(slider, g.pct);
    const pctLbl = document.createElement('span'); pctLbl.className = 'goal-pct'; pctLbl.textContent = g.pct + '%';
    slider.addEventListener('input', () => { pctLbl.textContent = slider.value + '%'; goalUpdateSliderBg(slider, parseInt(slider.value)); });
    slider.addEventListener('change', () => goalSetPct(g.id, parseInt(slider.value)));
    sliderRow.appendChild(slider); sliderRow.appendChild(pctLbl);
    main.appendChild(txt); main.appendChild(sliderRow);
    const del = document.createElement('button'); del.className = 'goal-del-btn'; del.textContent = '×';
    del.onclick = () => goalDelete(g.id);
    el.appendChild(icon); el.appendChild(main); el.appendChild(del);
    list.appendChild(el);
  });
}

function goalUpdateSliderBg(slider, val) {
  slider.style.background = `linear-gradient(90deg, #1C1C1C ${val}%, #EDE8E0 ${val}%)`;
}

// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    if (curEntityId) saveEntityPage();
  }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/interests-tracker/sw.js');
pomUpdateDisplay();
boot();
taskRender();
goalRender();
