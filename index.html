<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interests</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7f7f5; color: #1a1a1a; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── HEADER ── */
  header { padding: 14px 24px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  header h1 { font-size: 17px; font-weight: 700; }
  #syncStatus { font-size: 11px; color: #aaa; margin-left: auto; }

  /* ── LAYOUT ── */
  .app { display: flex; flex: 1; overflow: hidden; }

  /* ── LEFT PANEL ── */
  .left { width: 260px; min-width: 260px; background: #fff; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; flex-shrink: 0; }
  .left-header { padding: 14px 16px; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
  .left-header span { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.06em; }
  .add-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 6px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
  .add-btn:hover { background: #333; }
  .interest-list { flex: 1; overflow-y: auto; padding: 6px; }
  .interest-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 9px; margin-bottom: 2px; border: 1px solid transparent; user-select: none; }
  .interest-item:hover { background: #f7f7f5; }
  .interest-item.active { background: #f0efeb; border-color: #d9d9d4; }
  .interest-item .name { flex: 1; font-size: 14px; font-weight: 500; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.active { background: #22c55e; }
  .status-dot.next { background: #f59e0b; }
  .status-dot.someday { background: #94a3b8; }
  .status-dot.archived { background: #ddd; }
  .interest-item .del-btn { opacity: 0; background: none; border: none; color: #bbb; cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1; }
  .interest-item:hover .del-btn { opacity: 1; }
  .interest-item .del-btn:hover { color: #e53e3e; }

  /* ── RIGHT PANEL ── */
  .right { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bbb; gap: 8px; }
  .empty-state .icon { font-size: 36px; }
  .empty-state p { font-size: 14px; }

  /* ── INTEREST DETAIL ── */
  .detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .detail-header { padding: 20px 28px 0; flex-shrink: 0; }
  .back-btn { display: none; align-items: center; gap: 5px; background: none; border: none; color: #888; font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 10px; }
  .back-btn:hover { color: #1a1a1a; }
  .detail-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .detail-title { font-size: 22px; font-weight: 700; border: none; background: none; outline: none; flex: 1; color: #1a1a1a; }
  .detail-title:focus { border-bottom: 2px solid #1a1a1a; }
  .status-select { font-size: 11px; font-weight: 600; border: 1px solid #e5e5e5; border-radius: 20px; padding: 4px 10px; background: #fff; cursor: pointer; outline: none; color: #555; flex-shrink: 0; }

  /* ── TABS ── */
  .tabs { display: flex; border-bottom: 1px solid #e5e5e5; padding: 0 28px; flex-shrink: 0; }
  .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #999; cursor: pointer; margin-bottom: -1px; }
  .tab-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
  .tab-btn:hover:not(.active) { color: #555; }
  .tab-pane { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 20px 28px; gap: 24px; }
  .tab-pane.active { display: flex; }

  /* ── SECTION LABEL ── */
  .section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #aaa; margin-bottom: 8px; }

  /* ── NEXT ITEMS ── */
  .next-list { display: flex; flex-direction: column; gap: 5px; }
  .next-item { display: flex; align-items: center; gap: 8px; }
  .next-item input[type=checkbox] { accent-color: #1a1a1a; width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
  .next-item input[type=text] { flex: 1; border: none; background: none; outline: none; font-size: 14px; color: #1a1a1a; }
  .next-item input[type=text]:focus { border-bottom: 1px solid #ddd; }
  .next-item .rm { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0; opacity: 0; line-height: 1; }
  .next-item:hover .rm { opacity: 1; }
  .add-next { background: none; border: none; color: #aaa; font-size: 13px; cursor: pointer; padding: 2px 0; text-align: left; margin-top: 4px; }
  .add-next:hover { color: #1a1a1a; }
  .done-section { border-top: 1px solid #f0f0f0; margin-top: 8px; padding-top: 8px; }
  .done-toggle { background: none; border: none; color: #bbb; font-size: 12px; cursor: pointer; padding: 0; }
  .done-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .done-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #bbb; }
  .done-item .done-text { flex: 1; text-decoration: line-through; }
  .done-item .done-date { font-size: 11px; color: #ccc; white-space: nowrap; }
  .done-item .undo-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 11px; opacity: 0; }
  .done-item:hover .undo-btn { opacity: 1; }

  /* ── NOTE CARDS (Keep style) ── */
  .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .note-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; position: relative; min-height: 90px; }
  .note-card:hover { border-color: #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .note-card textarea { border: none; outline: none; resize: none; font-size: 13px; line-height: 1.55; color: #1a1a1a; font-family: inherit; background: transparent; flex: 1; min-height: 60px; }
  .note-card-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #ccc; cursor: pointer; font-size: 15px; opacity: 0; line-height: 1; padding: 0; }
  .note-card:hover .note-card-del { opacity: 1; }
  .note-card-del:hover { color: #e53e3e; }
  .notes-area { width: 100%; border: 1px solid #e5e5e5; border-radius: 10px; padding: 14px; font-size: 14px; line-height: 1.6; resize: none; outline: none; background: #fff; color: #1a1a1a; font-family: inherit; min-height: 120px; }
  .notes-area:focus { border-color: #aaa; }

  /* ── LINKS LIST ── */
  .links-list { display: flex; flex-direction: column; gap: 8px; }
  .link-item { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; }
  .link-item:hover { border-color: #ccc; }
  .link-favicon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.6; }
  .link-content { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .link-title-input { border: none; outline: none; font-size: 13px; font-weight: 500; color: #1a1a1a; background: none; width: 100%; }
  .link-url-input { border: none; outline: none; font-size: 11px; color: #888; background: none; width: 100%; }
  .link-url-display { font-size: 11px; color: #2563eb; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .link-url-display:hover { text-decoration: underline; }
  .link-item .rm { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0; opacity: 0; flex-shrink: 0; }
  .link-item:hover .rm { opacity: 1; }
  .add-link-btn { background: none; border: 1px dashed #ddd; border-radius: 8px; color: #bbb; font-size: 13px; cursor: pointer; padding: 8px 12px; text-align: left; }
  .add-link-btn:hover { border-color: #aaa; color: #666; }

  /* ── PROJECTS LIST ── */
  .projects-grid { display: flex; flex-direction: column; gap: 8px; }
  .project-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 16px; cursor: pointer; transition: border-color 0.15s; }
  .project-row:hover { border-color: #ccc; background: #fafaf9; }
  .project-row .proj-icon { font-size: 18px; flex-shrink: 0; }
  .project-row .proj-name { flex: 1; font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .project-row .proj-meta { font-size: 11px; color: #aaa; }
  .project-row .proj-arrow { color: #ccc; font-size: 14px; }
  .project-row .proj-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; opacity: 0; padding: 0; }
  .project-row:hover .proj-del { opacity: 1; }
  .add-project-btn { background: none; border: 1px dashed #ddd; border-radius: 10px; color: #bbb; font-size: 13px; cursor: pointer; padding: 12px 16px; text-align: left; }
  .add-project-btn:hover { border-color: #aaa; color: #666; }

  /* ── SAVE BAR ── */
  .save-bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 12px 28px; border-top: 1px solid #f0f0f0; flex-shrink: 0; background: #fff; }
  .save-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 7px 18px; font-size: 13px; cursor: pointer; }
  .save-btn:hover { background: #333; }
  .saved-msg { font-size: 12px; color: #22c55e; opacity: 0; transition: opacity 0.3s; }
  .saved-msg.show { opacity: 1; }

  /* ── PROJECT PAGE ── */
  .project-page { position: absolute; inset: 0; background: #fff; display: flex; flex-direction: column; z-index: 10; overflow: hidden; }
  .proj-page-header { padding: 16px 28px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .proj-page-back { background: none; border: none; color: #888; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .proj-page-back:hover { color: #1a1a1a; }
  .proj-page-save { margin-left: auto; background: #1a1a1a; color: #fff; border: none; border-radius: 7px; padding: 6px 16px; font-size: 13px; cursor: pointer; }
  .proj-page-save:hover { background: #333; }
  .proj-page-body { flex: 1; overflow-y: auto; padding: 32px 48px; display: flex; flex-direction: column; gap: 8px; max-width: 780px; width: 100%; margin: 0 auto; }
  .proj-title-input { font-size: 32px; font-weight: 700; border: none; outline: none; background: none; color: #1a1a1a; width: 100%; margin-bottom: 16px; }
  .proj-title-input::placeholder { color: #ddd; }

  /* blocks */
  .block { display: flex; align-items: flex-start; gap: 8px; padding: 3px 0; group: block; }
  .block-handle { color: #ddd; font-size: 13px; cursor: grab; padding-top: 3px; opacity: 0; flex-shrink: 0; width: 16px; }
  .block:hover .block-handle { opacity: 1; }
  .block-del { background: none; border: none; color: #ddd; cursor: pointer; font-size: 15px; padding: 0; opacity: 0; flex-shrink: 0; line-height: 1; padding-top: 2px; }
  .block:hover .block-del { opacity: 1; }
  .block-del:hover { color: #e53e3e; }
  .block-content { flex: 1; min-width: 0; }

  /* text block */
  .block-text { width: 100%; border: none; outline: none; resize: none; font-size: 15px; line-height: 1.65; color: #1a1a1a; font-family: inherit; background: none; }
  .block-text::placeholder { color: #ccc; }

  /* heading block */
  .block-heading { width: 100%; border: none; outline: none; font-size: 20px; font-weight: 700; color: #1a1a1a; font-family: inherit; background: none; }
  .block-heading::placeholder { color: #ddd; }

  /* checklist block */
  .block-checklist { display: flex; flex-direction: column; gap: 5px; }
  .block-check-item { display: flex; align-items: center; gap: 8px; }
  .block-check-item input[type=checkbox] { accent-color: #1a1a1a; width: 15px; height: 15px; flex-shrink: 0; }
  .block-check-item input[type=text] { flex: 1; border: none; outline: none; font-size: 15px; background: none; color: #1a1a1a; font-family: inherit; }
  .block-check-item input[type=text].checked { text-decoration: line-through; color: #aaa; }
  .block-check-item .rm { background: none; border: none; color: #ddd; cursor: pointer; font-size: 14px; padding: 0; opacity: 0; }
  .block-check-item:hover .rm { opacity: 1; }
  .add-check-item { background: none; border: none; color: #bbb; font-size: 13px; cursor: pointer; padding: 2px 0; text-align: left; margin-top: 2px; }
  .add-check-item:hover { color: #555; }

  /* link block */
  .block-link-item { display: flex; align-items: center; gap: 8px; background: #f7f7f5; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; }
  .block-link-item .link-content { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .block-link-title { border: none; outline: none; font-size: 13px; font-weight: 500; color: #1a1a1a; background: none; width: 100%; }
  .block-link-url { border: none; outline: none; font-size: 11px; color: #888; background: none; width: 100%; }
  .block-link-url-display { font-size: 11px; color: #2563eb; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .block-link-url-display:hover { text-decoration: underline; }
  .block-link-item .rm { background: none; border: none; color: #ccc; cursor: pointer; font-size: 15px; padding: 0; opacity: 0; }
  .block-link-item:hover .rm { opacity: 1; }

  /* add block menu */
  .add-block-row { display: flex; gap: 6px; padding: 8px 0; flex-wrap: wrap; }
  .add-block-btn { background: none; border: 1px solid #e5e5e5; border-radius: 6px; color: #999; font-size: 12px; cursor: pointer; padding: 5px 10px; display: flex; align-items: center; gap: 4px; }
  .add-block-btn:hover { border-color: #aaa; color: #333; background: #f7f7f5; }

  /* ── MOBILE ── */
  @media (max-width: 640px) {
    .app { flex-direction: column; }
    .left { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid #e5e5e5; max-height: 42vh; }
    .left.hidden { display: none; }
    .right { flex: 1; overflow-y: auto; }
    .detail { overflow-y: auto; }
    .back-btn { display: flex; }
    .next-item .rm, .link-item .rm, .note-card-del, .block-del, .block-handle, .done-item .undo-btn, .interest-item .del-btn { opacity: 1 !important; }
    .detail-header { padding: 16px 16px 0; }
    .tabs { padding: 0 16px; }
    .tab-pane { padding: 16px; }
    .save-bar { padding: 10px 16px; }
    .proj-page-body { padding: 20px 16px; }
    .notes-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>🗂 Interests</h1>
  <span id="syncStatus"></span>
</header>

<div class="app">
  <!-- LEFT -->
  <div class="left" id="leftPanel">
    <div class="left-header">
      <span>All Interests</span>
      <button class="add-btn" onclick="addInterest()">+ Add</button>
    </div>
    <div class="interest-list" id="interestList"></div>
  </div>

  <!-- RIGHT -->
  <div class="right" id="rightPanel">
    <div class="empty-state" id="emptyState">
      <div class="icon">✦</div>
      <p>Select an interest or add a new one</p>
    </div>

    <!-- INTEREST DETAIL -->
    <div class="detail" id="detailPanel" style="display:none;">
      <div class="detail-header">
        <button class="back-btn" onclick="goBack()">← All Interests</button>
        <div class="detail-title-row">
          <input class="detail-title" id="detailTitle" type="text" placeholder="Interest name" oninput="markDirty()">
          <select class="status-select" id="detailStatus" onchange="markDirty(); renderList()">
            <option value="next">🟡 Up Next</option>
            <option value="active">🟢 Active</option>
            <option value="someday">⚪ Someday</option>
            <option value="archived">🔘 Archived</option>
          </select>
        </div>
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('notes')">Notes</button>
          <button class="tab-btn" onclick="switchTab('projects')">Projects</button>
        </div>
      </div>

      <!-- NOTES TAB -->
      <div class="tab-pane active" id="tab-notes">
        <div>
          <textarea class="notes-area" id="detailNotes" placeholder="Jot down anything useful — what you learned, where you left off, ideas… Paste a link and it'll move to Resources automatically." oninput="handleNotesInput()"></textarea>
        </div>
        <div>
          <div class="section-label">Saved notes</div>
          <div class="notes-grid" id="notesGrid"></div>
        </div>
        <div>
          <div class="section-label">Resources & Links</div>
          <div class="links-list" id="linksList"></div>
          <button class="add-link-btn" onclick="addLink()">+ Add link</button>
        </div>
      </div>

      <!-- PROJECTS TAB -->
      <div class="tab-pane" id="tab-projects">
        <div class="projects-grid" id="projectsList"></div>
        <button class="add-project-btn" onclick="addProject()">+ New project</button>
      </div>

      <div class="save-bar">
        <span class="saved-msg" id="savedMsg">Saved ✓</span>
        <button class="save-btn" onclick="saveDetail()">Save</button>
      </div>
    </div>

    <!-- PROJECT PAGE (full page overlay) -->
    <div class="project-page" id="projectPage" style="display:none;">
      <div class="proj-page-header">
        <button class="proj-page-back" onclick="closeProjectPage()">← Back</button>
        <span id="projPageSyncStatus" style="font-size:11px;color:#aaa;margin-left:8px;"></span>
        <button class="proj-page-save" onclick="saveProjectPage()">Save</button>
      </div>
      <div class="proj-page-body" id="projPageBody"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://dvwdiqfkbooazvdjuzxg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2d2RpcWZrYm9vYXp2ZGp1enhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTQ3NjAsImV4cCI6MjA5NTc3MDc2MH0.sExMY6IZzJGcdtP-JKQJMkiSgqkuizMwE5nKNog6QOo';
const USER_ID = 'arindam';
const RECORD_ID = 'main';

let data = [];
let selectedId = null;
let dirty = false;
let currentProjId = null; // which project is open in project page

// ── SUPABASE ──────────────────────────────────────────
async function dbGet() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/interests?id=eq.${RECORD_ID}&user_id=eq.${USER_ID}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  const rows = await res.json();
  return rows[0]?.data || null;
}

async function dbSave(payload) {
  await fetch(`${SUPABASE_URL}/rest/v1/interests`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify({ id: RECORD_ID, user_id: USER_ID, data: payload, updated_at: new Date().toISOString() })
  });
}

function save() { dbSave(data); }

async function load() {
  document.getElementById('emptyState').innerHTML = '<div class="icon">⏳</div><p>Loading…</p>';
  const saved = await dbGet();
  data = (saved && saved.length > 0) ? saved : [
    { id: uid(), name: 'Cooking', status: 'next', nextItems: [], doneItems: [], noteCards: [], links: [], projects: [] },
    { id: uid(), name: 'Baking', status: 'next', nextItems: [], doneItems: [], noteCards: [], links: [], projects: [] },
    { id: uid(), name: 'Embroidery', status: 'next', nextItems: [], doneItems: [], noteCards: [], links: [], projects: [] },
    { id: uid(), name: 'Pottery', status: 'next', nextItems: [], doneItems: [], noteCards: [], links: [], projects: [] },
    { id: uid(), name: 'Hiking', status: 'next', nextItems: [], doneItems: [], noteCards: [], links: [], projects: [] },
  ];
  if (!saved || !saved.length) await dbSave(data);
  document.getElementById('emptyState').innerHTML = '<div class="icon">✦</div><p>Select an interest or add a new one</p>';
  renderList();
}

// ── HELPERS ───────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2, 10); }
function escHtml(s = '') { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getSelected() { return data.find(d => d.id === selectedId); }
function today() { return new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
function isMobile() { return window.innerWidth <= 640; }
function markDirty() { dirty = true; }
const URL_REGEX = /https?:\/\/[^\s"'<>]+/g;

// ── INTEREST LIST ─────────────────────────────────────
function renderList() {
  const list = document.getElementById('interestList');
  const order = { active: 0, next: 1, someday: 2, archived: 3 };
  [...data].sort((a, b) => order[a.status] - order[b.status]).forEach(item => {
    const div = document.createElement('div');
    div.className = 'interest-item' + (item.id === selectedId ? ' active' : '');
    div.innerHTML = `
      <span class="status-dot ${item.status}"></span>
      <span class="name">${escHtml(item.name)}</span>
      <button class="del-btn" onclick="deleteInterest('${item.id}',event)">×</button>
    `;
    div.addEventListener('click', () => selectInterest(item.id));
    list.appendChild(div);
  });
  // clear & re-add
  list.innerHTML = '';
  [...data].sort((a, b) => order[a.status] - order[b.status]).forEach(item => {
    const div = document.createElement('div');
    div.className = 'interest-item' + (item.id === selectedId ? ' active' : '');
    div.innerHTML = `
      <span class="status-dot ${item.status}"></span>
      <span class="name">${escHtml(item.name)}</span>
      <button class="del-btn" onclick="deleteInterest('${item.id}',event)">×</button>
    `;
    div.addEventListener('click', () => selectInterest(item.id));
    list.appendChild(div);
  });
}

function addInterest() {
  const item = { id: uid(), name: 'New Interest', status: 'next', nextItems: [], doneItems: [], noteCards: [], links: [], projects: [] };
  data.unshift(item);
  save();
  selectInterest(item.id);
  setTimeout(() => { const t = document.getElementById('detailTitle'); t.focus(); t.select(); }, 50);
}

function deleteInterest(id, e) {
  e.stopPropagation();
  if (!confirm('Delete this interest?')) return;
  data = data.filter(d => d.id !== id);
  if (selectedId === id) { selectedId = null; showEmpty(); }
  save(); renderList();
}

function showEmpty() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('detailPanel').style.display = 'none';
  if (isMobile()) document.getElementById('leftPanel').classList.remove('hidden');
}

function goBack() {
  if (dirty) saveDetail(true);
  showEmpty(); selectedId = null; renderList();
}

// ── SELECT INTEREST ───────────────────────────────────
function selectInterest(id) {
  if (dirty && selectedId) saveDetail(true);
  selectedId = id; dirty = false;
  renderList();
  const item = getSelected(); if (!item) return;

  // migrate old data shape
  if (!item.noteCards) item.noteCards = item.notes ? [{ id: uid(), text: item.notes }] : [];
  if (!item.links) item.links = (item.resources || []).map(r => typeof r === 'string' ? { id: uid(), url: r, title: '' } : r);
  if (!item.projects) item.projects = [];

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('detailPanel').style.display = 'flex';
  document.getElementById('detailPanel').style.flexDirection = 'column';
  if (isMobile()) document.getElementById('leftPanel').classList.add('hidden');

  document.getElementById('detailTitle').value = item.name;
  document.getElementById('detailStatus').value = item.status;

  document.getElementById('detailNotes').value = '';
  renderNextItems(item.nextItems || []);
  renderDoneItems(item.doneItems || []);
  renderNoteCards(item.noteCards || []);
  renderLinks(item.links || []);
  renderProjects(item.projects || []);
  switchTab('notes');
}

// ── TABS ──────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === tab));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + tab));
}

// ── NEXT ITEMS ────────────────────────────────────────
function renderNextItems(items) {
  const list = document.getElementById('nextList');
  list.innerHTML = '';
  items.forEach((ni, i) => {
    const row = document.createElement('div');
    row.className = 'next-item';
    row.innerHTML = `
      <input type="checkbox" onchange="completeNext(${i})">
      <input type="text" value="${escHtml(ni.text)}" placeholder="Next action…" oninput="markDirty()">
      <button class="rm" onclick="removeNext(${i})">×</button>
    `;
    list.appendChild(row);
  });
}

function addNextItem() {
  const item = getSelected(); if (!item) return;
  item.nextItems = item.nextItems || [];
  item.nextItems.push({ id: uid(), text: '' });
  save(); renderNextItems(item.nextItems);
  document.getElementById('nextList').querySelectorAll('input[type=text]').forEach((el, i, arr) => { if (i === arr.length-1) el.focus(); });
}

function removeNext(i) {
  const item = getSelected(); if (!item) return;
  item.nextItems.splice(i, 1); renderNextItems(item.nextItems); markDirty();
}

function completeNext(i) {
  const item = getSelected(); if (!item) return;
  const text = document.getElementById('nextList').querySelectorAll('.next-item input[type=text]')[i]?.value || item.nextItems[i]?.text || '';
  item.doneItems = item.doneItems || [];
  item.doneItems.push({ text, date: today() });
  item.nextItems.splice(i, 1);
  save(); renderNextItems(item.nextItems); renderDoneItems(item.doneItems);
  if (doneVisible) document.getElementById('doneList').style.display = 'flex';
}

let doneVisible = false;
function renderDoneItems(items) {
  const sec = document.getElementById('doneSection');
  const list = document.getElementById('doneList');
  const count = document.getElementById('doneCount');
  if (!items || !items.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block'; count.textContent = items.length; list.innerHTML = '';
  [...items].reverse().forEach((di, ri) => {
    const i = items.length - 1 - ri;
    const row = document.createElement('div'); row.className = 'done-item';
    row.innerHTML = `<span>✓</span><span class="done-text">${escHtml(di.text)}</span><span class="done-date">${di.date}</span><button class="undo-btn" onclick="undoDone(${i})">↩ undo</button>`;
    list.appendChild(row);
  });
}
function toggleDoneVisible() {
  doneVisible = !doneVisible;
  document.getElementById('doneList').style.display = doneVisible ? 'flex' : 'none';
  document.getElementById('doneToggle').innerHTML = `${doneVisible?'▼':'▶'} Done (<span id="doneCount">${(getSelected()?.doneItems||[]).length}</span>)`;
}
function undoDone(i) {
  const item = getSelected(); if (!item) return;
  const done = item.doneItems.splice(i, 1)[0];
  item.nextItems.push({ id: uid(), text: done.text });
  save(); renderNextItems(item.nextItems); renderDoneItems(item.doneItems);
  if (doneVisible) document.getElementById('doneList').style.display = 'flex';
}

// ── NOTE CARDS ────────────────────────────────────────
function renderNoteCards(cards) {
  const grid = document.getElementById('notesGrid'); grid.innerHTML = '';
  cards.forEach((c, i) => {
    const card = document.createElement('div'); card.className = 'note-card';
    card.innerHTML = `
      <button class="note-card-del" onclick="removeNoteCard(${i})">×</button>
      <textarea placeholder="Write a note…" oninput="markDirty()">${escHtml(c.text)}</textarea>
    `;
    grid.appendChild(card);
  });
}

function addNoteCard() {
  const item = getSelected(); if (!item) return;
  item.noteCards = item.noteCards || [];
  item.noteCards.push({ id: uid(), text: '' });
  save(); renderNoteCards(item.noteCards);
  setTimeout(() => { const tas = document.getElementById('notesGrid').querySelectorAll('textarea'); if (tas.length) tas[tas.length-1].focus(); }, 30);
}

function removeNoteCard(i) {
  const item = getSelected(); if (!item) return;
  item.noteCards.splice(i, 1); save(); renderNoteCards(item.noteCards);
}

function handleNotesInput() {
  const ta = document.getElementById('detailNotes');
  const text = ta.value;
  const urls = text.match(URL_REGEX);
  if (!urls) { markDirty(); return; }
  const item = getSelected(); if (!item) { markDirty(); return; }
  item.links = item.links || [];
  let changed = false;
  urls.forEach(url => {
    const clean = url.replace(/[),.\]]+$/, '');
    if (!item.links.find(l => l.url === clean)) {
      item.links.push({ id: uid(), url: clean, title: '' }); changed = true;
    }
  });
  ta.value = text.replace(URL_REGEX, '').replace(/\n{3,}/g, '\n\n').trimEnd();
  if (changed) { save(); renderLinks(item.links); }
  markDirty();
}

// ── LINKS ─────────────────────────────────────────────
function renderLinks(links) {
  const list = document.getElementById('linksList'); list.innerHTML = '';
  links.forEach((lk, i) => {
    const row = document.createElement('div'); row.className = 'link-item';
    const isUrl = lk.url && lk.url.startsWith('http');
    row.innerHTML = `
      <div class="link-content">
        <input class="link-title-input" value="${escHtml(lk.title)}" placeholder="Title (optional)" oninput="markDirty()">
        ${isUrl
          ? `<a class="link-url-display" href="${escHtml(lk.url)}" target="_blank">${escHtml(lk.url)}</a>`
          : `<input class="link-url-input" value="${escHtml(lk.url)}" placeholder="https://…" oninput="handleLinkUrlInput(${i}, this)">`
        }
      </div>
      <button class="rm" onclick="removeLink(${i})">×</button>
    `;
    list.appendChild(row);
  });
}

function addLink() {
  const item = getSelected(); if (!item) return;
  item.links = item.links || [];
  item.links.push({ id: uid(), url: '', title: '' });
  save(); renderLinks(item.links);
  setTimeout(() => { const inputs = document.getElementById('linksList').querySelectorAll('.link-url-input'); if (inputs.length) inputs[inputs.length-1].focus(); }, 30);
}

function handleLinkUrlInput(i, el) {
  const item = getSelected(); if (!item) return;
  item.links[i].url = el.value;
  // if a full URL is pasted, re-render to show as clickable link
  if (el.value.startsWith('http') && el.value.length > 10) { save(); renderLinks(item.links); }
  else markDirty();
}

function removeLink(i) {
  const item = getSelected(); if (!item) return;
  item.links.splice(i, 1); save(); renderLinks(item.links);
}

// ── PROJECTS LIST ─────────────────────────────────────
function renderProjects(projects) {
  const list = document.getElementById('projectsList'); list.innerHTML = '';
  (projects || []).forEach((proj, pi) => {
    const blockCount = (proj.blocks || []).length;
    const row = document.createElement('div'); row.className = 'project-row';
    row.innerHTML = `
      <span class="proj-icon">📄</span>
      <span class="proj-name">${escHtml(proj.name || 'Untitled Project')}</span>
      <span class="proj-meta">${blockCount} block${blockCount !== 1 ? 's' : ''}</span>
      <span class="proj-arrow">→</span>
      <button class="proj-del" onclick="deleteProject('${proj.id}', event)">×</button>
    `;
    row.addEventListener('click', () => openProjectPage(proj.id));
    list.appendChild(row);
  });
}

function addProject() {
  const item = getSelected(); if (!item) return;
  if (dirty) saveDetail(true);
  const proj = { id: uid(), name: 'New Project', blocks: [] };
  item.projects = item.projects || [];
  item.projects.push(proj);
  save(); renderProjects(item.projects);
  openProjectPage(proj.id);
}

function deleteProject(projId, e) {
  e.stopPropagation();
  const item = getSelected(); if (!item) return;
  if (!confirm('Delete this project?')) return;
  item.projects = item.projects.filter(p => p.id !== projId);
  save(); renderProjects(item.projects);
}

// ── PROJECT PAGE ──────────────────────────────────────
function openProjectPage(projId) {
  const item = getSelected(); if (!item) return;
  const proj = item.projects.find(p => p.id === projId); if (!proj) return;
  currentProjId = projId;
  document.getElementById('projectPage').style.display = 'flex';
  document.getElementById('projectPage').style.flexDirection = 'column';
  renderProjectPage(proj);
}

function closeProjectPage() {
  saveProjectPage();
  document.getElementById('projectPage').style.display = 'none';
  currentProjId = null;
  const item = getSelected();
  if (item) renderProjects(item.projects || []);
}

function getCurrentProj() {
  const item = getSelected(); if (!item) return null;
  return item.projects.find(p => p.id === currentProjId) || null;
}

function renderProjectPage(proj) {
  const body = document.getElementById('projPageBody'); body.innerHTML = '';

  // Title
  const titleInput = document.createElement('input');
  titleInput.className = 'proj-title-input';
  titleInput.value = proj.name || '';
  titleInput.placeholder = 'Project name…';
  titleInput.oninput = () => { const p = getCurrentProj(); if (p) p.name = titleInput.value; };
  body.appendChild(titleInput);

  // Blocks
  const blocksContainer = document.createElement('div');
  blocksContainer.id = 'blocksContainer';
  body.appendChild(blocksContainer);
  renderBlocks(proj.blocks || []);

  // Add block row
  const addRow = document.createElement('div'); addRow.className = 'add-block-row';
  addRow.innerHTML = `
    <button class="add-block-btn" onclick="addBlock('text')">✏️ Text</button>
    <button class="add-block-btn" onclick="addBlock('heading')">H Heading</button>
    <button class="add-block-btn" onclick="addBlock('checklist')">☑ Checklist</button>
    <button class="add-block-btn" onclick="addBlock('link')">🔗 Link</button>
  `;
  body.appendChild(addRow);
}

function renderBlocks(blocks) {
  const container = document.getElementById('blocksContainer'); if (!container) return;
  container.innerHTML = '';
  blocks.forEach((bl, i) => {
    const wrap = document.createElement('div'); wrap.className = 'block';
    wrap.innerHTML = `<span class="block-handle">⠿</span><div class="block-content" id="block-content-${i}"></div><button class="block-del" onclick="removeBlock(${i})">×</button>`;
    container.appendChild(wrap);
    renderBlockContent(bl, i);
  });
}

function renderBlockContent(bl, i) {
  const content = document.getElementById(`block-content-${i}`); if (!content) return;
  content.innerHTML = '';
  const proj = getCurrentProj();

  if (bl.type === 'text') {
    const ta = document.createElement('textarea'); ta.className = 'block-text';
    ta.value = bl.text || ''; ta.placeholder = 'Write something…';
    ta.oninput = () => { if (proj) proj.blocks[i].text = ta.value; autoResize(ta); };
    ta.rows = 1; content.appendChild(ta); setTimeout(() => autoResize(ta), 0);

  } else if (bl.type === 'heading') {
    const inp = document.createElement('input'); inp.className = 'block-heading';
    inp.value = bl.text || ''; inp.placeholder = 'Heading';
    inp.oninput = () => { if (proj) proj.blocks[i].text = inp.value; };
    content.appendChild(inp);

  } else if (bl.type === 'checklist') {
    const div = document.createElement('div'); div.className = 'block-checklist';
    (bl.items || []).forEach((ci, ci_i) => {
      const row = document.createElement('div'); row.className = 'block-check-item';
      row.innerHTML = `
        <input type="checkbox" ${ci.done ? 'checked' : ''} onchange="toggleBlockCheck(${i}, ${ci_i})">
        <input type="text" value="${escHtml(ci.text)}" class="${ci.done ? 'checked' : ''}" placeholder="To-do…" oninput="updateBlockCheckText(${i}, ${ci_i}, this.value)">
        <button class="rm" onclick="removeBlockCheckItem(${i}, ${ci_i})">×</button>
      `;
      div.appendChild(row);
    });
    const addBtn = document.createElement('button'); addBtn.className = 'add-check-item';
    addBtn.textContent = '+ Add item'; addBtn.onclick = () => addBlockCheckItem(i);
    div.appendChild(addBtn); content.appendChild(div);

  } else if (bl.type === 'link') {
    const lkDiv = document.createElement('div'); lkDiv.className = 'block-link-item';
    const isUrl = bl.url && bl.url.startsWith('http');
    lkDiv.innerHTML = `
      <div class="link-content">
        <input class="block-link-title" value="${escHtml(bl.title||'')}" placeholder="Title (optional)" oninput="updateBlockLink(${i},'title',this.value)">
        ${isUrl
          ? `<a class="block-link-url-display" href="${escHtml(bl.url)}" target="_blank">${escHtml(bl.url)}</a>`
          : `<input class="block-link-url" value="${escHtml(bl.url||'')}" placeholder="https://…" oninput="updateBlockLink(${i},'url',this.value)">`
        }
      </div>
      <button class="rm" onclick="removeBlock(${i})">×</button>
    `;
    content.appendChild(lkDiv);
  }
}

function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

function addBlock(type) {
  const proj = getCurrentProj(); if (!proj) return;
  proj.blocks = proj.blocks || [];
  const bl = { id: uid(), type };
  if (type === 'text' || type === 'heading') bl.text = '';
  if (type === 'checklist') bl.items = [];
  if (type === 'link') { bl.url = ''; bl.title = ''; }
  proj.blocks.push(bl);
  renderBlocks(proj.blocks);
  // focus last block
  setTimeout(() => {
    const inputs = document.getElementById('blocksContainer').querySelectorAll('input[type=text], textarea, input:not([type=checkbox])');
    if (inputs.length) inputs[inputs.length-1].focus();
  }, 30);
}

function removeBlock(i) {
  const proj = getCurrentProj(); if (!proj) return;
  proj.blocks.splice(i, 1); renderBlocks(proj.blocks);
}

function toggleBlockCheck(bi, ci_i) {
  const proj = getCurrentProj(); if (!proj) return;
  proj.blocks[bi].items[ci_i].done = !proj.blocks[bi].items[ci_i].done;
  renderBlockContent(proj.blocks[bi], bi);
}

function updateBlockCheckText(bi, ci_i, val) {
  const proj = getCurrentProj(); if (!proj) return;
  proj.blocks[bi].items[ci_i].text = val;
}

function addBlockCheckItem(bi) {
  const proj = getCurrentProj(); if (!proj) return;
  proj.blocks[bi].items = proj.blocks[bi].items || [];
  proj.blocks[bi].items.push({ id: uid(), text: '', done: false });
  renderBlockContent(proj.blocks[bi], bi);
  setTimeout(() => {
    const rows = document.getElementById(`block-content-${bi}`)?.querySelectorAll('input[type=text]');
    if (rows?.length) rows[rows.length-1].focus();
  }, 30);
}

function removeBlockCheckItem(bi, ci_i) {
  const proj = getCurrentProj(); if (!proj) return;
  proj.blocks[bi].items.splice(ci_i, 1); renderBlockContent(proj.blocks[bi], bi);
}

function updateBlockLink(bi, field, val) {
  const proj = getCurrentProj(); if (!proj) return;
  proj.blocks[bi][field] = val;
  if (field === 'url' && val.startsWith('http') && val.length > 10) renderBlockContent(proj.blocks[bi], bi);
}

async function saveProjectPage() {
  const el = document.getElementById('projPageSyncStatus');
  if (el) { el.textContent = 'Saving…'; }
  save();
  await dbSave(data);
  if (el) { el.textContent = 'Saved ✓'; setTimeout(() => { if (el) el.textContent = ''; }, 2000); }
}

// ── SAVE DETAIL ───────────────────────────────────────
async function saveDetail(silent) {
  const item = getSelected(); if (!item) return;
  item.name = document.getElementById('detailTitle').value || 'Untitled';
  item.status = document.getElementById('detailStatus').value;

  // collect next items
  item.nextItems = Array.from(document.getElementById('nextList').querySelectorAll('.next-item')).map((row, i) => ({
    id: item.nextItems[i]?.id || uid(),
    text: row.querySelector('input[type=text]').value
  }));

  // first update existing cards from DOM
  const cardTas = Array.from(document.getElementById('notesGrid').querySelectorAll('.note-card textarea'));
  cardTas.forEach((ta, i) => { if (item.noteCards[i]) item.noteCards[i].text = ta.value; });
  // then snapshot textarea into a new card if it has text
  const notesTa = document.getElementById('detailNotes');
  if (notesTa && notesTa.value.trim()) {
    item.noteCards = item.noteCards || [];
    item.noteCards.unshift({ id: uid(), text: notesTa.value.trim() });
    notesTa.value = '';
    renderNoteCards(item.noteCards);
  }

  // collect links
  const linkRows = document.getElementById('linksList').querySelectorAll('.link-item');
  item.links = Array.from(linkRows).map((row, i) => {
    const titleEl = row.querySelector('.link-title-input');
    const urlInputEl = row.querySelector('.link-url-input');
    const urlDisplayEl = row.querySelector('.link-url-display');
    return {
      id: item.links[i]?.id || uid(),
      title: titleEl?.value || '',
      url: urlInputEl?.value || urlDisplayEl?.href || item.links[i]?.url || ''
    };
  });

  const sync = document.getElementById('syncStatus');
  sync.textContent = 'Saving…';
  await dbSave(data);
  sync.textContent = 'Synced ✓';
  setTimeout(() => sync.textContent = '', 2000);
  dirty = false; renderList();
  if (!silent) { const msg = document.getElementById('savedMsg'); msg.classList.add('show'); setTimeout(() => msg.classList.remove('show'), 2000); }
}

// ── KEYBOARD SHORTCUT ─────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    if (currentProjId) saveProjectPage(); else if (selectedId) saveDetail();
  }
});

(async () => { await load(); })();
</script>
</body>
